- date: '2026-08-03'
  product: Adobe Express Add-ons
  breaking: true
  highlights:
  - >-
    Dark theme support: the `theme` property and `themechange` event now report both
    "light" and "dark". Add-ons submitted to the marketplace after 2026-08-31 are
    REJECTED if their UI is functionally broken in dark mode.
  - >-
    Large Document Support reached Phase 2 — new APIs stable, deprecated ones removed,
    migration window open.
  - >-
    Stabilized (no longer behind the experimentalApis flag): visitPages(),
    keepContentActiveDuringAsync(), addOnUISdk.app.document.isPresentation(),
    editor.createThreadedText(), ThreadedTextContentModel.allFrames,
    ThreadedTextList.addFrame().
