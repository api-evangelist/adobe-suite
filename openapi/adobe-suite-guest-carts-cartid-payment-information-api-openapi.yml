openapi: 3.2.0
info:
  title: Adobe Suite Guest Carts/{cart Id}/payment Information API
  version: 2.4.6
  description: 'Operations tagged guest-carts/{cartId}/payment-information across 2 of this provider''s published API definitions: adobe-suite-commerce-rest-customer-openapi.yaml, adobe-suite-commerce-rest-guest-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://example.com/rest/default
tags:
- name: guest-carts/{cartId}/payment-information
paths:
  /V1/guest-carts/{cartId}/payment-information:
    post:
      tags:
      - guest-carts/{cartId}/payment-information
      description: Set payment information and place order for a specified cart.
      operationId: PostV1GuestcartsCartIdPaymentinformation
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                type: integer
                description: Order ID.
            application/xml:
              schema:
                type: integer
                description: Order ID.
        '500':
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
      summary: guest-carts/{cartId}/payment-information
      requestBody:
        content:
          application/json:
            schema:
              required:
              - email
              - paymentMethod
              properties:
                email:
                  type: string
                paymentMethod:
                  $ref: '#/components/schemas/quote-data-payment-interface'
                billingAddress:
                  $ref: '#/components/schemas/quote-data-address-interface'
              type: object
              xml:
                name: request
          application/xml:
            schema:
              required:
              - email
              - paymentMethod
              properties:
                email:
                  type: string
                paymentMethod:
                  $ref: '#/components/schemas/quote-data-payment-interface'
                billingAddress:
                  $ref: '#/components/schemas/quote-data-address-interface'
              type: object
              xml:
                name: request
    get:
      tags:
      - guest-carts/{cartId}/payment-information
      description: Get payment information
      operationId: GetV1GuestcartsCartIdPaymentinformation
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/checkout-data-payment-details-interface'
            application/xml:
              schema:
                $ref: '#/components/schemas/checkout-data-payment-details-interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
      summary: guest-carts/{cartId}/payment-information
    servers:
    - url: https://example.com/rest/default
