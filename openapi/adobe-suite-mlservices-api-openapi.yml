components:
  schemas:
    LinkObject:
      required:
      - href
      type: object
      properties:
        href:
          type: string
          description: Either an URI (RFC3986) or an URI Template (RFC6570) in which case the linkObject SHOULD have a 'templated' attribute whose value is true
        templated:
          type: boolean
          description: True if the link href is templated, false otherwise which is also the default
          default: false
        type:
          type: string
          description: A hint to indicate the media type expected when dereferencing the target resource
        method:
          type: string
          description: The HTTP method to be applied when using this link. This should be a valid HTTP method name such as GET, PUT, POST, PATCH, DELETE where GET implies support for HEAD as well
          default: GET
        title:
          type: string
          description: A label with a human-readable identifier (as defined by RFC5988)
        hrefLang:
          type: string
          description: The language of the target resource (as defined by RFC5988)
    MLService:
      allOf:
      - $ref: '#/components/schemas/MLServiceSummary'
      - type: object
        properties:
          tags:
            type: object
            additionalProperties:
              type: string
          _links:
            type: object
            properties:
              self:
                $ref: '#/components/schemas/LinkObject'
              getMLService:
                $ref: '#/components/schemas/LinkObject'
              deleteMLService:
                $ref: '#/components/schemas/LinkObject'
              getMLInstance:
                $ref: '#/components/schemas/LinkObject'
    MLServiceListingLinks:
      allOf:
      - $ref: '#/components/schemas/PagingNavigationAttributes'
      - type: object
        properties:
          self:
            $ref: '#/components/schemas/LinkObject'
          createMLInstance:
            $ref: '#/components/schemas/LinkObject'
    PagingNavigationAttributes:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/LinkObject'
        page:
          $ref: '#/components/schemas/LinkObject'
    MLServiceListing:
      type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/MLServiceSummary'
        _page:
          $ref: '#/components/schemas/PagingInformationAttributes'
        _links:
          $ref: '#/components/schemas/MLServiceListingLinks'
    SenseiApiResponse:
      type: object
      properties:
        type:
          type: string
          readOnly: true
          example: https://platform.adobe.io/data/foundation/ml/problems/illegal-argument
        title:
          type: string
          readOnly: true
          example: Illegal Argument
        status:
          type: integer
          format: int32
          readOnly: true
          example: 400
        detail:
          type: string
          readOnly: true
          example: Model specification name must not be empty
        additionalDetails:
          type: object
          additionalProperties:
            type: string
    MLServiceSummary:
      required:
      - mlInstanceId
      - name
      - scoringDataSetId
      - scoringSchedule
      - scoringTimeframe
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        mlInstanceId:
          type: string
        trainingExperimentId:
          type: string
        trainingExperimentRunId:
          type: string
        trainingDataSetId:
          type: string
        trainingTimeframe:
          type: integer
          format: int32
        scoringExperimentId:
          type: string
        scoringDataSetId:
          type: string
        scoringTimeframe:
          type: integer
          format: int32
        trainingSchedule:
          type: object
          properties:
            startTime:
              type: string
              format: datetime
            endTime:
              type: string
              format: datetime
            cron:
