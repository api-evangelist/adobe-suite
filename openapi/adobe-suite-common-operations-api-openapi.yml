          format: uri
          maxLength: 2083
          minLength: 1
          title: The pre-signed URL
          type: string
      title: PublicBinaryInputV3
      type: object
    ImageGenerateRequestV3:
      type: object
      title: ImageGenerateRequestV3
      required:
      - prompt
      properties:
        prompt:
          type: string
          title: The prompt
          description: The prompt used to generate the image. The longer the prompt, the better.
          minLength: 1
          maxLength: 1500
        aspectRatio:
          $ref: '#/components/schemas/AspectRatio'
          description: The aspect ratio of the requested generations. This controls the size of the generated image. When <code>referenceBlobs</code> is included in the request, this property should be omitted or set to <code>auto</code>.
        resolutionLevel:
          type: string
          title: Resolution level
          description: The resolution level.
          enum:
          - 1MP
          - 2.4MP
          - 4MP
          default: 2.4MP
        modelId:
          $ref: '#/components/schemas/FireflyModelId'
          description: 'The specific model to use for image generation. Available options: ''firefly_image'' for Firefly Image model.'
        modelSpecificPayload:
          $ref: '#/components/schemas/ModelSpecificPayloadV3'
          description: Additional model-specific parameters for controlling the generation process.
        numVariations:
          type: integer
          maximum: 1
          title: The number of variations
          description: The number of image variations to generate. Greater than 1 is not supported. Only one image per variation is allowed. For multiple variations, send separate requests.
        referenceBlobs:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceBlobV3'
          title: Reference blobs
          description: List of reference blobs that will be used as additional input for the generation process. Only one reference image is supported. When this array is not empty, <code>aspectRatio</code> must be omitted or set to <code>auto</code>. [Pre-signed URLs can be used from supported domains](https://developer.adobe.com/firefly-services/docs/firefly-api/getting-started/usage-notes/#image-api-usage).
          default: []
          maxItems: 1
        seeds:
          type: array
          items:
            type: integer
          maxItems: 1
          title: The seeds for the generations
          description: The seed value to vary the image generation. Only one seed per variation is allowed. If specified alongside with numVariations, the number of seeds must be equal to numVariations.
    StorageImageResponse:
      description: Storage response.
      type: object
      properties:
        images:
          type: array
          description: Array of objects containing asset ID.
          items:
            $ref: '#/components/schemas/StorageImage'
      title: StorageImageResponse
    Links:
      type: object
