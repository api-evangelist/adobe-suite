    GenerateImagesRequestV3:
      properties:
        contentClass:
          $ref: '#/components/schemas/ContentClassV3'
          description: Directs the style of a generated image to be photographic or like fine art.
        customModelId:
          type: string
          description: Include the specific custom model ID when a custom model type is designated in the `x-model-version` header parameter.
        negativePrompt:
          description: A negative prompt of things Firefly will try to avoid generating in the image. Not supported for Firefly Custom Models on Image Model 3 or Firefly Custom Models on Image Model 4.
          maxLength: 1024
          type: string
        numVariations:
          description: The number of variations to generate. <code>numVariations</code> defaults to the number of seed images, or to 1 if you do not specify `seeds`.
          maximum: 4
          minimum: 1
          type: integer
        prompt:
          description: A text prompt to support the generation of an image. The longer the prompt the better Firefly performs.
          maxLength: 1024
          minLength: 1
          type: string
        promptBiasingLocaleCode:
          description: A hyphen-separated string combining the ISO 639-1 language code and the ISO 3166-1 region (like en-US). When a locale is set, the prompt will be biased to generate more relevant content for that region. If not specified, the locale will be auto-detected based on your profile and the accepted language header.
          type: string
        seeds:
          description: An array of seed image IDs. These reference images help ensure consistent image generation across multiple API calls. For example, use the same seed to generate a similar image in different styles. If specified along with <code>numVariations</code>, the number of seeds provided must equal <code>numVariations</code>.
          items:
            type: integer
          maxItems: 4
          minItems: 1
          type: array
          uniqueItems: true
        size:
          allOf:
          - $ref: '#/components/schemas/Size'
          default:
            height: 2048
            width: 2048
          description: 'The desired width and height for the final image, in pixels. Supported sizes for the output images with `image3` are: <ul> <li>Square (1:1) - width 2048px, height 2048px </li> <li>Square (1:1) - width 1024px, height 1024px </li> <li>Landscape (4:3)  - width 2304px, height 1792px </li> <li>Portrait (3:4)  - width 1792px, height 2304px</li>  <li>Widescreen (16:9) - width 2688px, height 1536px </li> <li>Widescreen (16:9) - width 2688px, height 1512px </li> <li>(7:4)  - width 1344px, height 768px </li> <li>(7:4)  - width 1344px, height 756px </li> <li>(9:7) - width 1152px, height 896px </li> <li>(7:9) - width 896px, height 1152px</li> </ul> Supported sizes for the output images with `image4` are: <ul> <li>(1:1) - width 2048px, height 2048px</li> <li>(4:3) - width 2304px, height 1792px</li> <li>(3:4) - width 1792px, height 2304px</li> <li>(16:9) - width 2688px, height 1536px</li> <li>(9:16) - width 1440px, height 2560px</li> </ul>.'
        structure:
          description: An object with the reference image details for structure.
          $ref: '#/components/schemas/StructureReferenceV3'
        style:
          description: An object with the reference image details for style.
          $ref: '#/components/schemas/StylesV3'
        upsamplerType:
          description: Only supported with the model version `image4_custom`. The `default` setting upscales generated images to 2k. The `low_creativity` setting refines the image generation by removing distortions, smoothing textures, and sometimes adding details (like freckles to faces in close-up). This setting is recommended for generating images with human subjects.
          enum:
          - default
          - low_creativity
          default: default
          type: string
        visualIntensity:
          description: Adjust the overall intensity of your photo's characteristics, such as contrast, shadow, and hue. This is not supported with the model version `image4_custom`.
          maximum: 10
          minimum: 2
          type: integer
      required:
      - prompt
      title: Generating images from prompt
      type: object
