  /v3/custom-models:
    get:
      summary: Retrieve custom models
      description: Retrieve the custom models for a user.
      operationId: getCustomModels
      tags:
      - Common Operations
      parameters:
      - name: x-user-token
        in: header
        description: A user token referencing the user's individual account, obtained using their credentials. The user token must be preceded by `Bearer`.
        schema:
          type: string
      - name: x-request-id
        in: header
        description: A unique request identifier defined by you. This is used by Adobe Support to trace the request in logs. This header is automatically generated by the server if not explicitly set.
        required: true
        schema:
          type: string
      - name: sortBy
        in: query
        description: A sorting option for the response list. For a reverse sort, use `-` (e.g., `-modifiedDate`). Multi-vector sorting is not currently supported.
        schema:
          type: string
          default: modifiedDate
          enum:
          - assetName
          - createdDate
          - modifiedDate
      - name: start
        in: query
        description: The first result to include in a paginated response. Required if a `limit` is specified.
        schema:
          type: string
          default: '0'
      - name: limit
        in: query
        description: The number of custom models to return in a paginated response.
        schema:
          type: string
          maximum: 50
          minimum: 1
      - name: publishedState
        in: query
        description: This filters custom models by published state.
        schema:
          type: string
          default: published
          enum:
          - all
          - ready
          - published
          - unpublished
          - queued
          - training
          - failed
          - cancelled
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomModelsFF3pInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
