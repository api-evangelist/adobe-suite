components:
  parameters:
    XApiKey:
      name: x-api-key
      in: header
      required: true
      description: The API key associated with your Experience Platform account. For more information, see the [authentication tutorial](http://www.adobe.com/go/platform-api-authentication-en).
      schema:
        type: string
      example: 3c14558cb79f4ee6dd9884243314f482
    toDate:
      name: toDate
      in: query
      schema:
        type: string
      description: 'This parameter specifies the end date of the date range. It allows the user to filter the work orders to include  only those created on or before this date. NOTE: If you specify the `toDate`, you must also specify the `fromDate`.

        '
      example: '2099-01-01'
    ContentType:
      name: Content-Type
      in: header
      required: true
      description: The media type of the request body. Should be 'application/json'.
      schema:
        type: string
      example: application/json
    page:
      name: page
      in: query
      schema:
        type: integer
      description: 'An integer that indicates which page of expirations to return. Index of the results page to return. Page indexing  starts at 0. The default page size is 50 results, with a maximum of 100 results per page.

        '
      example: 3
    search:
      name: search
      in: query
      schema:
        type: string
      description: 'Filters expirations using a case-insensitive partial match (wildcard search) across multiple fields. The `search` parameter matches records where the value is contained in any of the following fields:  `author`, `displayName`, `description`, or `datasetName`, or is an exact match for the expiration ID.

        '
      example: acme
    XRequestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
      description: 'The tracing ID associated with the request. If none is provided, the server generates one.

        '
      example: YrgXiqvCobA9neOmrzCP7kQLi4yIizoP
    description:
      name: description
      in: query
      schema:
        type: string
      description: A description of the purpose of the request.
      example: Handle expiration of Acme information through the end of 2024.
    fromDate:
      name: fromDate
      in: query
      schema:
        type: string
      description: 'This parameter specifies the start date of the date range. It allows the user to filter the work orders to include  only those created on or after this date. NOTE: If you specify the `fromDate`, you must also specify the `toDate`.

        '
      example: '2099-01-01'
    workorderStatus:
      name: status
      in: query
      schema:
        type: string
        enum:
        - received
        - validated
        - submitted
        - ingested
        - completed
        - failed
      description: 'A comma-separated list of workorder statuses to filter results. When included, the response returns only work orders matching the specified statuses. Status values are case-sensitive and must match exactly.

        '
      example: submitted,completed
    workorderType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - identity-delete
      description: 'Filter the results by the work order type.

        '
      example: identity-delete
    workorderIdQueryParameter:
      name: workorderId
      in: query
      schema:
        type: string
      description: Filter work orders by providing a specific work order ID. This requires an exact match.
      example: DI-1729d091-b08b-47f4-923f-6a4af52c93ac
    author:
      name: author
      in: query
      schema:
        type: string
      description: 'Use the `author` query parameter to find the person who most recently updated the dataset expiration or workorder. If no updates  have been made since its creation, this will match the original creator. This parameter matches  entries where the `created_by` field corresponds to the search string.  If the search string begins with `LIKE` or `NOT LIKE`, the remainder is treated as an SQL search pattern. Otherwise,  the entire search string is treated as a literal string that must exactly match the entire content of a `created_by`  field.

        '
      example: LIKE %john%, John Q. Public
    workorderId:
      name: WORKORDER_ID
      in: path
      required: true
      schema:
        type: string
      description: The ID of the deletion order. This can be used to look up the status of the deletion later.
      example: DI-a15345b8-a2d6-4d6f-b33c-5b593e86439a
    sandboxName:
      name: sandboxName
      in: query
      schema:
        type: string
      description: 'Matches work orders whose sandbox name exactly matches the `x-sandbox-name` header provided in the work order request.  Use `sandboxName=*` to include work orders from all sandboxes.

        '
      example: dev1
    Authorization:
      name: Authorization
      in: header
      required: true
      description: The bearer token for authentication. For more information, see the [authentication tutorial](http://www.adobe.com/go/platform-api-authentication-en).
      schema:
        type: string
      example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.GOTCHARACTER.TOKENVALUE
    filterDate:
      name: filterDate
      in: query
      schema:
        type: string
      description: 'This parameter only returns the work orders that were created, updated, or have a particular status on that specific date. `filterDate` can be used with other query parameters to narrow down your search results and provide more specific and  relevant information.

        '
      example: '2024-06-12'
    displayName:
      name: displayName
      in: query
      schema:
        type: string
      description: Matches the display name provided in the search string. The match is case-insensitive.
      example: License Expiry
    properties:
      name: properties
      in: query
      schema:
        type: string
      description: 'A comma-separated list of additional fields to include in each work order result. Specify one or more field names, separated by commas. Field names may contain only letters, numbers, and the following characters: `/ . , _ -`. For example, to include `field1` and `field2` in the response, use: `properties=field1,field2`. This parameter is optional. If not specified, only default fields are returned.

        '
      example: field1,field2
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: An integer between 1 and 100 indicates the maximum number of expirations to return. Defaults to 25.
      example: 50
    XImsOrgId:
      name: x-gw-ims-org-id
      in: header
      required: true
      description: The organization ID associated with your Experience Platform account. See the [authentication tutorial](http://www.adobe.com/go/platform-api-authentication-en).
      schema:
        type: string
    XSandboxName:
      name: x-sandbox-name
      in: header
      required: true
      schema:
        type: string
      description: 'All resources in Experience Platform are isolated to specific virtual sandboxes. Requests to Platform APIs require a  header that specifies the name of the sandbox in which the operation will take place.

        '
      example: loyalty-uat
    orderBy:
      name: orderBy
      in: query
      schema:
        type: string
        enum:
        - displayName, +displayName, -displayName
        - description, +description, -description
        - id, +id, -id
        - createdBy, +createdBy, -createdBy
        - createdAt, +createdAt, -createdAt
        - updatedAt, +updatedAt, -updatedAt
        - operation, +operation, -operation
        - operationCount, +operationCount, -operationCount
        - status, +status, -status
      description: 'The orderBy query parameter specifies the sorting order of the results returned by the API. Use it to arrange the  data based on one or more fields, either in ascending (ASC) or descending (DESC) order. Use the + or - prefix to  signify ASC, DESC respectively. The default sort direction is ascending when no prefix is provided.

        '
      example: -datasetName
  schemas:
    WorkorderDetailResponse:
      type: object
      properties:
        workorderId:
          type: string
          description: The unique identifier for the work order.
          example: DI-6fa98d52-7bd2-42a5-bf61-fb5c22ec9427
        orgId:
          type: string
          description: Your organization's unique identifier.
          example: 3C7F2AC143214567890ABCDE@AcmeOrg
        bundleId:
          type: string
          description: 'The unique identifier of the bundle containing this deletion order. Bundling allows multiple deletion  orders to be grouped and processed together by downstream services. Primarily used for troubleshooting  and tracking.

            '
          example: BN-dbe3ffad-cb0b-401f-91ae-01c189f8e7b2
        action:
          type: string
          description: The action type requested in the work order.
          example: identity-delete
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the work order was created.
          example: 2037-01-21 08:25:45.119000+00:00
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the work order was last updated.
          example: 2037-01-21 08:30:45.233000+00:00
        operationCount:
          type: integer
          description: The number of operations included in the work order.
          example: 1
        targetServices:
          type: array
