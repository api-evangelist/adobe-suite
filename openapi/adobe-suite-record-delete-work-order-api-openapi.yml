    CreateWorkorderRequest:
      type: object
      properties:
        displayName:
          type: string
          description: A human-readable label for this work order.
          example: Acme Loyalty - Customer Data Deletion
        description:
          type: string
          description: A description of the work order request.
          example: Delete all records associated with the specified email addresses from the Acme_Loyalty_2023 dataset.
        action:
          type: string
          description: 'The action requested for the work order. **NOTE**: The request value differs from the response value. Use "delete_identity" in requests,  while responses will return "identity-delete".

            '
          example: delete_identity
        datasetId:
          type: string
          description: 'The unique identifier for the dataset. If you are deleting from a single dataset, this value must be the ID of the dataset in question. If you are deleting from all datasets,  set the value to `ALL`.

            If you are specifying a single dataset, the dataset’s associated Experience Data Model (XDM) schema must have a primary identity defined.  If the dataset does not have a primary identity, then it must have an identity map in order to be modified by a Data Lifecycle request. If an identity map exists, it will be present as a top-level field named `identityMap`. Note that a dataset row may have many identities in its identity map, but only one can be marked as primary. "primary": true must be included  to force the ID to match a primary identity.

            '
          example: 7eab61f3e5c34810a49a1ab3
        namespacesIdentities:
          type: array
          description: A list of identity namespaces and their corresponding IDs to delete.
          items:
            type: object
            required:
            - namespace
            - IDs
            properties:
              namespace:
                type: object
                description: "Specifies the identity namespace to which the IDs belong (for example, \"email\", \"phone\", or \na custom namespace code).\n"
                required:
                - code
                properties:
                  code:
                    type: string
                    description: The identity namespace code (such as "email").
                    example: email
              IDs:
                type: array
                description: List of identity values to delete for this namespace.
                items:
                  type: string
                example:
                - alice.smith@acmecorp.com
                - bob.jones@acmecorp.com
                - charlie.brown@acmecorp.com
