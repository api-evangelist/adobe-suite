openapi: 3.2.0
info:
  title: Data Hygiene Record Delete (Work order) API
  description: "Use the Data Hygiene REST API to schedule expiration dates for datasets or delete stored customer personal data in Experience Platform.\n- **Related documentation**:\n  - [Advanced Data Lifecycle Management overview](https://experienceleague.adobe.com/en/docs/experience-platform/data-lifecycle/home)\n  - [Quota endpoint](https://experienceleague.adobe.com/en/docs/experience-platform/data-lifecycle/api/quota)\n  - [Workorder endpoint](https://experienceleague.adobe.com/en/docs/experience-platform/data-lifecycle/api/workorder)\n  - [Dataset expiration endpoint](https://experienceleague.adobe.com/en/docs/experience-platform/data-lifecycle/api/dataset-expiration)\n  - [Best practices for Advanced Data Lifecycle Management](https://experienceleague.adobe.com/en/docs/experience-platform/data-lifecycle/best-practices)\n\n- **Visualize API calls with Postman (a free, third-party software)**:\n  * [Video guide for creating the Postman environment](https://video.tv.adobe.com/v/28832)\n  * [Steps for importing environments and collections in Postman](https://learning.getpostman.com/docs/postman/collection_runs/using_environments_in_collection_runs/)\n\n- **API paths**:\n  * Platform Gateway URL: https://<span>platform.adobe.io\n  * Base path for this API: /data/core/hygiene/\n  * Example of a complete path for making a call to \"/ttl\": https://<span>platform.adobe.io/data/core/hygiene/ttl\n\n- **Required headers**:\n  * All calls require the headers `Authorization`, `x-gw-ims-org-id`, and `x-api-key`. For more information on how to obtain these values, \n    see the [authentication tutorial](http://www.adobe.com/go/platform-api-authentication-en).\n  * All requests with a payload in the request body (such as POST and PUT calls) must include the header `Content-Type` with a value of `application/json`.\n\n- **API error handling**:\n  * Refer to the Experience Platform API troubleshooting guide for [FAQs](https://experienceleague.adobe.com/docs/experience-platform/landing/troubleshooting.html#faq), \n    [API status codes](https://experienceleague.adobe.com/docs/experience-platform/landing/troubleshooting.html#api-status-codes), \n    and [request header errors](https://experienceleague.adobe.com/docs/experience-platform/landing/troubleshooting.html#request-header-errors).\n"
  version: 1.0.0
servers:
- url: https://{environment}.adobe.io
  variables:
    environment:
      default: platform
      enum:
      - platform
      - platform-stage
tags:
- name: Record Delete (Work order)
  description: 'Use the `/workorder` endpoint in the Data Hygiene API to programmatically manage record delete requests in Adobe  Experience Platform. Specify primary identities to target and remove the relevant records.

    '
paths:
  /workorder:
    get:
      summary: List all work order requests
      description: 'Retrieves a paginated list of work order requests for data hygiene operations in your organization.

        You can filter results using query parameters. Each work order record includes action type, status, and related dataset and user information.

        '
      operationId: getWorkOrders
      tags:
      - Record Delete (Work order)
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XApiKey'
      - $ref: '#/components/parameters/XImsOrgId'
      - $ref: '#/components/parameters/XSandboxName'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/workorderType'
      - $ref: '#/components/parameters/workorderStatus'
      - $ref: '#/components/parameters/author'
      - $ref: '#/components/parameters/displayName'
      - $ref: '#/components/parameters/description'
      - $ref: '#/components/parameters/workorderIdQueryParameter'
      - $ref: '#/components/parameters/sandboxName'
      - $ref: '#/components/parameters/fromDate'
      - $ref: '#/components/parameters/toDate'
      - $ref: '#/components/parameters/filterDate'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/orderBy'
      - $ref: '#/components/parameters/properties'
      responses:
        '200':
          x-summary: Success
          description: Successfully retrieved list of work order requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkorderListResponse'
              examples:
                default:
                  summary: Example /workorder GET response
                  value:
                    results:
                    - workorderId: DI-1729d091-b08b-47f4-923f-6a4af52c93ac
                      orgId: 9C1F2AC143214567890ABCDE@AcmeOrg
                      bundleId: BN-4cfabf02-c22a-45ef-b21f-bd8c3d631f41
                      action: identity-delete
                      createdAt: 2034-03-15 11:02:10.935000+00:00
                      updatedAt: 2034-03-15 11:10:10.938000+00:00
                      operationCount: 3
                      targetServices:
                      - profile
                      - datalake
                      - identity
                      status: received
                      createdBy: a.stark@acme.com <a.stark@acme.com> BD8C3D631F41@acme.com
                      datasetId: a7b7c8f3a1b8457eaa5321ab
                      datasetName: Acme_Customer_Exports
                      displayName: Customer Identity Delete Request
                      description: Scheduled identity deletion for compliance
                    - workorderId: DI-2a4c6a3d-dbb9-45e4-b37c-11203e4dbb6e
                      orgId: 9C1F2AC143214567890ABCDE@AcmeOrg
                      bundleId: BN-4cfabf02-c22a-45ef-b21f-bd8c3d631f41
                      action: identity-delete
                      createdAt: 2034-03-16 10:32:00.101000+00:00
                      updatedAt: 2034-03-16 10:40:00.204000+00:00
                      operationCount: 2
                      targetServices:
                      - profile
                      - datalake
                      status: received
                      createdBy: t.lannister@acme.com <t.lannister@acme.com> BD8C3D631F41@acme.com
                      datasetId: 5c7a6b8f3b9b455eac9321cd
                      datasetName: Acme_Loyalty_Events
                      displayName: Loyalty Identity Delete Request
                      description: Scheduled deletion for loyalty dataset
                    total: 2
                    count: 2
                    _links:
                      next:
                        href: https://platform.adobe.io/workorder?page=1&limit=2
                        templated: false
                      page:
                        href: https://platform.adobe.io/workorder?limit={limit}&page={page}
                        templated: true
        '400':
          x-summary: Bad Request
          description: 'The request is invalid or missing required parameters. This may occur if the JSON payload  is malformed or required fields are missing.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '401':
          x-summary: Unauthorized
          description: Authentication failed or you do not have permissions for the requested operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
        '403':
          x-summary: Forbidden
          description: You do not have permission to access this resource or perform the requested operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403'
        '500':
          x-summary: Internal server error
          description: 'This can occur if there is an issue on the server while processing the request.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
    post:
      summary: Create a new work order request
      description: 'Submits a new work order to perform a data hygiene action (such as identity deletion or dataset expiration) for your organization.

        The work order is processed asynchronously and will appear in the work order list after submission.

        '
      operationId: createWorkOrder
      tags:
      - Record Delete (Work order)
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XApiKey'
      - $ref: '#/components/parameters/XImsOrgId'
      - $ref: '#/components/parameters/XSandboxName'
      - $ref: '#/components/parameters/ContentType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkorderRequest'
            examples:
              default:
                summary: Delete customer records by email (Acme Loyalty)
                value:
                  displayName: Acme Loyalty - Customer Data Deletion
                  description: Delete all records associated with the specified email addresses from the Acme_Loyalty_2023 dataset.
                  action: delete_identity
                  datasetId: 7eab61f3e5c34810a49a1ab3
                  namespacesIdentities:
                  - namespace:
                      code: email
                    IDs:
                    - alice.smith@acmecorp.com
                    - bob.jones@acmecorp.com
                    - charlie.brown@acmecorp.com
      responses:
        '200':
          x-summary: Success
          description: Successfully created work order request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkorderResponse'
              examples:
                default:
                  summary: Example /workorder POST response
                  value:
                    workorderId: DI-95c40d52-6229-44e8-881b-fc7f072de63d
                    orgId: 8B1F2AC143214567890ABCDE@AcmeOrg
                    bundleId: BN-c61bec61-5ce8-498f-a538-fb84b094adc6
                    action: identity-delete
                    createdAt: 2035-06-02 09:21:00+00:00
                    updatedAt: 2035-06-02 09:21:05+00:00
                    operationCount: 1
                    targetServices:
                    - profile
                    - datalake
                    - identity
                    status: received
                    createdBy: c.lannister@acme.com <c.lannister@acme.com> 7EAB61F3E5C34810A49A1AB3@acme.com
                    datasetId: 7eab61f3e5c34810a49a1ab3
                    datasetName: Acme_Loyalty_2023
                    displayName: Loyalty Identity Delete Request
                    description: Schedule deletion for Acme loyalty program dataset
        '400':
          x-summary: Bad Request
          description: 'The request is invalid or missing required parameters. This may occur if the JSON payload  is malformed or required fields are missing.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '401':
          x-summary: Unauthorized
          description: Authentication failed or you do not have permissions for the requested operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
        '500':
          x-summary: Internal server error
          description: 'This can occur if there is an issue on the server while processing the request.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
  /workorder/{WORKORDER_ID}:
    get:
      summary: Retrieve details for a specific work order request
      description: 'Returns information for a specific work order request, identified by its work order ID.

        The response includes action type, status, associated dataset and user information, and audit metadata.

        '
      operationId: getWorkOrderById
      tags:
      - Record Delete (Work order)
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XApiKey'
      - $ref: '#/components/parameters/XImsOrgId'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/XSandboxName'
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/workorderId'
      responses:
        '200':
          x-summary: Success
          description: Successfully retrieved work order request details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkorderDetailResponse'
              examples:
                default:
                  summary: Example /workorder/{WORKORDER_ID} GET response
                  value:
                    workorderId: DI-6fa98d52-7bd2-42a5-bf61-fb5c22ec9427
                    orgId: 3C7F2AC143214567890ABCDE@AcmeOrg
                    bundleId: BN-dbe3ffad-cb0b-401f-91ae-01c189f8e7b2
                    action: identity-delete
                    createdAt: 2037-01-21 08:25:45.119000+00:00
                    updatedAt: 2037-01-21 08:30:45.233000+00:00
                    operationCount: 3
                    targetServices:
                    - ajo
                    - profile
                    - datalake
                    - identity
                    status: received
                    createdBy: g.baratheon@acme.com <g.baratheon@acme.com> C189F8E7B2@acme.com
                    datasetId: d2f1c8a4b8f747d0ba3521e2
                    datasetName: Acme_Marketing_Events
                    displayName: Marketing Identity Delete Request
                    description: Scheduled identity deletion for marketing compliance
                    productStatusDetails:
                    - productName: Data Management
                      productStatus: success
                      createdAt: 2022-08-08 16:51:31.535872+00:00
                    - productName: Identity Service
                      productStatus: success
                      createdAt: 2022-08-08 16:43:46.331150+00:00
                    - productName: Profile Service
                      productStatus: waiting
                      createdAt: 2022-08-08 16:37:13.443481+00:00
        '400':
          x-summary: Bad Request
          description: 'The request is invalid or missing required parameters. This may occur if the JSON payload  is malformed or required fields are missing.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '401':
          x-summary: Unauthorized
          description: Authentication failed or you do not have permissions for the requested operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401'
        '404':
          x-summary: Not Found
          description: Work order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '500':
          x-summary: Internal server error
          description: 'This can occur if there is an issue on the server while processing the request.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse500'
    put:
      summary: Update an existing work order request
      description: 'Updates selected fields of a specific work order, identified by the `WORKORDER_ID`.

        Update the `name` and `description`` of a specific work order.

        '
      operationId: updateWorkOrderById
      tags:
      - Record Delete (Work order)
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/XApiKey'
      - $ref: '#/components/parameters/XImsOrgId'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/XSandboxName'
      - $ref: '#/components/parameters/workorderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkorderRequest'
            examples:
