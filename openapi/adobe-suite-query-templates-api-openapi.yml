          content: {}
        '500':
          x-summary: Internal server error
          description: There was an internal server error. Try the request again in a few minutes, and contact Adobe Support if the problem persists.
          content: {}
components:
  schemas:
    query_template_delete:
      type: object
      properties:
        message:
          type: string
          description: A message to indicate the outcome of the request.
          example: Deleted
        statusCode:
          type: string
          description: The status code generated by the request.
          example: 202
    _page:
      type: object
      properties:
        orderby:
          type: string
          description: The property by which this page is ordered.
          example: -created
        start:
          type: string
          description: The first value, in sorted order, of the orderby property on this page.
          example: '2021-12-06T22:00:17.362Z'
        next:
          type: string
          description: The start value for the next page.
          example: '2022-11-22T00:52:34.839Z'
        property:
          type: string
          description: The list of properties by which the result is filtered, if any. If the `property` query parameter is set when the query is issued, then it is returned in the `_page` object.
          example: created>=2021-04-05T13:30:00Z,state==IN_PROGRESS
        count:
          type: integer
          description: The number of items on the page.
          example: 26
      description: Pagination information for this resource. It contains a `count` property for the number of resources returned.
    query_template:
      type: object
      properties:
        sql:
          type: string
          description: The SQL query statement. You can use either standard SQL or include parameter replacements. To use a parameter replacement in the SQL you must prepend the parameter key with a `$`. For example, `$key`, and provide the parameters used in the SQL as JSON key value pairs in the `queryParameters` field.
          example: SELECT $key from $key1 where $key > $key2;
        name:
          type: string
          description: The name for the template.
          example: Sample template query
        id:
          type: string
          description: The ID of the query template.
          example: f7cb5155-29da-4b95-6131-6c5beadjde7f
        queryParameters:
          type: object
          properties:
            key:
              type: string
              description: An example key value pair for a parameterized query.
              example: value
            key1:
              type: string
              description: An example key value pair for a parameterized query.
              example: value1
            key2:
              type: string
              description: An example key value pair for a parameterized query.
              example: value2
          description: A key value pairing for replacing values in the SQL. The key must be prepended with a `$`. For example, `SELECT column1 FROM table2 WHERE column1=$key;`. No value type checking will be done. This is required if using a parameter replacement.
        updated:
          type: string
          description: The time in UTC format when query template was last updated.
          example: '2022-11-21T21:50:01.469Z'
        lastUpdatedBy:
          type: string
          description: The ID of the user who last updated the template.
          example: '{USER_ID}'
        userId:
          type: string
          description: The ID of the user who created the template.
          example: '{USER_ID}'
        _links:
          $ref: '#/components/schemas/query_template_links'
      description: Query Template Response.
    next:
      type: object
      properties:
        href:
          type: string
          description: A link to the next page of results.
          example: https://platform.adobe.io/data/foundation/query/queries/alert-subscriptions?orderby=-created&page=2
      description: Pre-constructed URI for the next page of results, if any exist.
    query_list_template_links:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/next'
        prev:
          $ref: '#/components/schemas/prev'
    query_template_links:
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
              description: The URI of this resource.
              example: https://platform-va7.adobe.io/data/foundation/query/query-templates/2f560b99-abc0-4058-92dj-9408jaddcd71
            method:
              type: string
              description: The HTTP method to use with the `href`.
              example: GET
          description: Contains the information required to access this resource.
        update:
          type: object
          properties:
            href:
              type: string
              description: The URI to update this resource.
              example: https://platform-va7.adobe.io/data/foundation/query/query-templates/2f560b99-abc0-4058-92dj-9408jaddcd71
            method:
              type: string
              description: The HTTP method to use with the `href`.
              example: PUT
            body:
              type: string
              description: The JSON payload to send to the `href`.
              example: '{\"sql\" : \"new sql\", \"name\" : \"new name\"}'
          description: Contains the information required to update this resource.
        delete:
          type: object
          properties:
            href:
              type: string
              description: The URI to delete this resource.
              example: https://platform-va7.adobe.io/data/foundation/query/query-templates/2f560b99-abc0-4058-92dj-9408jaddcd71
            method:
              type: string
              description: The HTTP method to use with the `href`.
              example: DELETE
          description: Contains the information required to delete this resource.
      description: The object contains links to perform actions on this schedule run.
    query_template_def:
      required:
      - name
      - sql
      type: object
      properties:
        sql:
          type: string
          description: You can either use standard SQL or a parameter replacement. To use a parameter replacement in the SQL you must prepend the parameter key with a `$`. For example, `$key`, and provide the parameters used in the SQL as JSON key value pairs in the `queryParameters` field. The values passed here will be the default parameters used in the template. If you want to override these parameters, you must override them in the POST request.
          example: SELECT $key FROM $key1 WHERE $key > $key2;
        queryParameters:
          type: object
          properties:
            key:
              type: string
              description: A set of two linked data items. The key is a unique identifier for some item of data, and the value, is either the data that is identified or a pointer to the location of that data.
              example: value
            key1:
              type: string
              description: A set of two linked data items. The key is a unique identifier for some item of data, and the value, is either the data that is identified or a pointer to the location of that data.
              example: value1
            key2:
              type: string
              description: A set of two linked data items. The key is a unique identifier for some item of data, and the value, is either the data that is identified or a pointer to the location of that data.
              example: value2
          description: A key value pairing to replace values in the SQL statement. These are required if you are using parameter replacements. No value type checking will be done on these key value pairs.
        name:
          type: string
          description: A descriptive and human readable name for the template.
          example: Test Parameterized Query
      description: A description of the query template to be submitted.
    template_count:
      type: object
      properties:
        totalCount:
          type: integer
          description: The total number of templates.
