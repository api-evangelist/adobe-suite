components:
  schemas:
    PostLibraryElementsPayload:
      type: object
      required:
      - client
      - name
      - type
      properties:
        id:
          type: string
          description: Ignored if submitted. The result will have a different ID.
        description:
          type: string
          description: Description of new element
        name:
          type: string
          description: Display name for new element
        type:
          type: string
          description: Element type
        client:
          description: Client identification information
          $ref: '#/components/schemas/ClientDeviceInfoPayload'
        representations:
          type: array
          description: Add or associate existing content to the new element
          items:
            $ref: '#/components/schemas/DbLibraryElementRepresentationData'
        sourceRef:
          type: string
          description: Reference other content as inspiration for this element
        source:
          description: Required if copying an element to this library.
          $ref: '#/components/schemas/ElementListPayload'
        self:
          description: Required if moving an element to this library.
          $ref: '#/components/schemas/ElementListPayload'
    DbLibraryInvitationData:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        recipientEmail:
          type: string
          readOnly: true
        senderName:
          type: string
          readOnly: true
        created:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        canComment:
          type: boolean
          readOnly: true
        canShare:
          type: boolean
          readOnly: true
    BatchResponse:
      type: object
      properties:
        responses:
          type: array
          readOnly: true
          items:
            type: object
            properties: {}
        requests:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/BatchPayloadElement'
    BatchPayload:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/BatchPayloadElement'
    AsyncResponsePayload:
      type: object
      properties:
        status:
          type: string
          enum:
          - OK
          - CREATED
          - ACCEPTED
          - NO_CONTENT
          - MOVED_PERMANENTLY
          - SEE_OTHER
          - NOT_MODIFIED
          - TEMPORARY_REDIRECT
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - NOT_ACCEPTABLE
          - CONFLICT
          - GONE
          - PRECONDITION_FAILED
          - UNSUPPORTED_MEDIA_TYPE
          - INTERNAL_SERVER_ERROR
          - SERVICE_UNAVAILABLE
        message:
          type: string
    UpdateLibraryPayload:
      type: object
      properties:
        name:
          type: string
    BatchPayloadElement:
      type: object
      properties:
        method:
          type: string
        path:
          type: string
        body:
          type: object
          additionalProperties:
            type: object
            properties: {}
    DbLibraryCollaborationData:
      type: object
      properties:
        rootURN:
          type: string
        ownerId:
          type: string
        state:
          type: string
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/DbLibraryCollaboratorData'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/DbLibraryInvitationData'
        public:
          type: boolean
        _fc:
          type: boolean
        directCollaborators:
          type: array
          items:
            $ref: '#/components/schemas/DbLibraryCollaboratorData'
        hasAdmin:
          type: boolean
          readOnly: true
    LibrariesInfo:
      type: object
      properties:
        total_count:
          type: integer
          format: int32
          description: Total results for query
        libraries:
          type: array
          description: Libraries list
          items:
            $ref: '#/components/schemas/DbLibraryInfo'
        _page:
          description: List Page
          $ref: '#/components/schemas/PageSpec'
        _links:
          description: List Links
          $ref: '#/components/schemas/MelvilleHypermediaListLinks'
    AsyncMonitorResponseDTO:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        retryAfter:
          type: integer
          format: int64
        _fc:
          type: boolean
    DbLibraryElementDetailsCreatedModifiedData:
      type: object
      properties:
        userId:
          type: string
        deviceId:
          type: string
        device:
          type: string
        app:
          type: string
        time:
          type: integer
          format: int64
    LibraryElementsInfo:
      type: object
      properties:
        total_count:
          type: integer
          format: int32
          description: Total results for query
        elements:
          type: array
          description: Elements list
          items:
            $ref: '#/components/schemas/DbLibraryElementData'
        _page:
          description: List Page
          $ref: '#/components/schemas/PageSpec'
        _links:
          description: List Links
          $ref: '#/components/schemas/LinksSpec'
    USSSearchPayload:
      type: object
      properties:
        asset_type:
          type: array
          description: '`library` and/or `element`. Leaving this out of the request will get both by default, though element-only parameters like `library_id` or `archived` will isolate the result to elements.'
          uniqueItems: true
          items:
            type: string
        library_id:
          type: string
          description: 'Library ID (URN) to constrain an elements search to a single library (like "urn:aaid:sc:us:2f3268e9-039d-460f-8b07-8854f7677645"). Invalid if submitted with `"asset_type": ["library"]`.'
        group:
          type: string
          description: 'Isolate element results to a single group. Invalid if submitted with `"asset_type": ["library"]`.'
        name:
          type: string
          description: A name string to identify by library/asset name. Requires an exact match.
        query_string:
          type: string
          description: A general query string to search for libraries/assets. Includes partial matches.
        created_date:
          type: array
          description: Start & end dates in epoch time (ms since epoch).
          items:
            type: string
            format: date-time
        modified_date:
          type: array
          description: Start & end dates in epoch time (ms since epoch).
          items:
            type: string
            format: date-time
        type:
          type: array
          description: 'One or more types for elements, invalid if submitted with `"asset_type": ["library"]`.'
          items:
            type: string
        archived:
          type: boolean
          description: 'Search specifically for archived elements (boolean `true`/`false` to isolate results to archived or non-archived). Invalid if submitted with `"asset_type": ["library"]`.'
        orderBy:
          type: string
          description: defaults to `-modified_date`, also accepts `name`. Use a minus sign prefix to note descending.
        start:
          type: string
          description: String value. For libraries lists, the requirement to integrate bookmarked responses requires us to use the field in a clever fashion beyond a simple positive integer.
        limit:
          type: integer
          format: int32
          description: Positive integer, defines the number of results to return for a paged response. Defaults to `10`. Max limit for library searches is `10`, max limit for element searches is `100`.
        owner:
          type: string
          description: '`private` (default), `incoming`, `outgoing`, `public`, or `all`. `all` does not include `public` until bookmarks are integrated into the USS search results.'
        selector:
          type: string
          description: Customize response for larger/smaller data sets. (`default` [base response], `rendition_grid`, `collaboration`, `details`, `full`).
        has_stock_content:
          type: boolean
          description: Search for libraries that have stock content, or elements within a library that have stock content (boolean `true`/`false` to isolate results to stock content or all content).
        stock_content_id:
          type: string
          description: 'Search for elements with a specific Stock Content ID. Invalid if submitted with `"asset_type": ["library"]` or `"has_stock_content": false`.'
        spark_brand_urn:
          type: string
          description: Search for elements with a specific Spark tracking data brand_urn.
        spark_creator_id:
          type: string
          description: Search for elements with a specific Spark tracking data creator_id.
        spark_content_summary:
          type: string
          description: Search for elements with a partial match within the Spark tracking data content_summary.
        source_ref:
          type: string
          description: Search for elements with a specific sourceRef.
    USSSearchResponse:
      type: object
      properties:
        total_items:
          type: integer
          format: int32
          readOnly: true
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/DbLibraryInfo'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/DbLibraryElementData'
    DbLibraryRenditionData:
      type: object
      properties:
        _fc:
          type: boolean
        main:
          $ref: '#/components/schemas/DbLibraryElementRenditionData'
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/DbLibraryElementRenditionData'
    ErrorResponse:
      type: object
      properties:
        reason:
          type: string
        message:
          type: string
      xml:
        name: error
    CreateLibraryPayload:
      type: object
      properties:
        name:
          type: string
          description: Human-readable name for library. *Required* for creating a new library (not for move/copy)
        source:
          type: string
          description: URN or public library ID of the source library. *Required* for copy.
        self:
          type: string
          description: URN or public library ID of the library to be moved. *Required* for move.
    ClientDeviceInfoPayload:
      type: object
      properties:
        deviceId:
          type: string
        device:
          type: string
        app:
          type: string
    DbLibraryElementDetailData:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        created:
          $ref: '#/components/schemas/DbLibraryElementDetailsCreatedModifiedData'
        lastModified:
          $ref: '#/components/schemas/DbLibraryElementDetailsCreatedModifiedData'
        description:
          type: string
    MelvilleHypermediaListLinks:
      type: object
      properties:
        page:
          description: Page Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
        next:
          description: Next Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
    MelvilleHypermediaLibraryElementLinks:
      type: object
      properties:
        http://ns.adobe.com/melville/rel/primary:
          description: Primary Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
        http://ns.adobe.com/melville/rel/path:
          description: Path Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
        http://ns.adobe.com/melville/rel/id:
          description: ID Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
        http://ns.adobe.com/melville/rel/ac/policy:
          description: Policy Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
        http://ns.adobe.com/melville/rel/ac/check:
          description: Check Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
        http://ns.adobe.com/melville/rel/ac/effective:
          description: Effective Link
          $ref: '#/components/schemas/MelvilleHypermediaLink'
        http://ns.adobe.com/melville/rel/describedBy:
