components:
  schemas:
    Benefit:
      type: object
      properties:
        commitment:
          $ref: '#/components/schemas/CommitmentTerm'
        commitmentRequest:
          $ref: '#/components/schemas/CommitmentTerm'
        recommitmentRequest:
          $ref: '#/components/schemas/CommitmentTerm'
        type:
          type: string
          enum:
          - THREE_YEAR_COMMIT
      title: Benefit
    AutoRenewal:
      type: object
      properties:
        enabled:
          type: boolean
        renewalQuantity:
          type: integer
          format: int32
      title: AutoRenewal
    Contact:
      type: object
      required:
      - email
      - firstName
      - lastName
      properties:
        email:
          type: string
          minLength: 0
          maxLength: 240
          pattern: (?:[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*|"(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*")@(?:(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-zA-Z0-9-]*[a-zA-Z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])
        firstName:
          type: string
          pattern: ^[\p{L}\p{N}-_ 　,.＆&'\"]{1,35}$
        lastName:
          type: string
          pattern: ^[\p{L}\p{N}-_ 　,.＆&'\"]{1,35}$
        phoneNumber:
          type: string
          minLength: 0
          maxLength: 40
      title: Contact
    Pair_string_string:
      type: object
      properties:
        key:
          type: string
        left:
          type: string
        right:
          type: string
        value:
          type: string
      title: Pair«string,string»
    Address:
      type: object
      required:
      - addressLine1
      - city
      - country
      - postalCode
      - region
      properties:
        addressLine1:
          type: string
          minLength: 0
          maxLength: 60
          pattern: ^[^<>[\"]]*$
        addressLine2:
          type: string
          minLength: 0
          maxLength: 60
          pattern: ^[^<>[\"]]*$
        city:
          type: string
          minLength: 0
          maxLength: 40
          pattern: ^[^<>[\"]]*$
        country:
          type: string
          minLength: 0
          maxLength: 3
        phoneNumber:
          type: string
          minLength: 0
          maxLength: 40
          pattern: ^[^<>[\"]]*$
        postalCode:
          type: string
          minLength: 0
          maxLength: 40
        region:
          type: string
          minLength: 0
          maxLength: 255
      title: Address
    CompanyProfile:
      type: object
      required:
      - address
      - companyName
      - preferredLanguage
      properties:
        address:
          $ref: '#/components/schemas/Address'
        companyName:
          type: string
          pattern: ^[\p{L}\p{N}_ 　,.＆&・\'()（）\"\/-]{3,250}$
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        marketSegment:
          type: string
          pattern: COM|EDU|GOV
        marketSegments:
          type: array
          items:
            type: string
        marketSubSegments:
          type: array
          items:
            type: string
        preferredLanguage:
          type: string
          minLength: 0
          maxLength: 40
      title: CompanyProfile
    ContractDiscountLevel:
      type: object
      properties:
        level:
          type: string
        offerType:
          type: string
      title: ContractDiscountLevel
    CommitmentTerm:
      type: object
      properties:
        endDate:
          type: string
          format: date
        minimumQuantities:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentQuantity'
        startDate:
          type: string
          format: date
        status:
          type: string
      title: CommitmentTerm
    AccountResource:
      type: object
      properties:
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/Benefit'
        companyProfile:
          $ref: '#/components/schemas/CompanyProfile'
        cotermDate:
          type: string
          example: yyyy-MM-dd
        creationDate:
          type: string
          example: yyyy-MM-dd'T'HH:mm:ss'Z'
        customerId:
          type: string
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/ContractDiscountLevel'
        distributorId:
          type: string
        externalReferenceId:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLink'
        resellerId:
          type: string
        status:
          type: string
      title: AccountResource
    SubscriptionHistoryResource:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionResource'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLink'
        totalCount:
          type: integer
          format: int32
      title: SubscriptionHistoryResource
    Account:
      type: object
      required:
      - companyProfile
      properties:
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/Benefit'
        companyProfile:
          $ref: '#/components/schemas/CompanyProfile'
        cotermDate:
          type: string
          pattern: ^(\d{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01]))?$
        creationDate:
          type: string
          format: date-time
        customerId:
          type: string
          pattern: ^[\p{L}\d\-]{4,40}$
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/ContractDiscountLevel'
        distributorId:
          type: string
          pattern: ^[\p{L}\d\-]{4,40}$
        externalReferenceId:
          type: string
          minLength: 0
          maxLength: 35
          pattern: ^[^<>[\"]]*$
        resellerId:
          type: string
          pattern: ^[\p{L}\d\-]{4,40}$
        status:
          type: string
      title: Account
    CommitmentQuantity:
      type: object
      properties:
        offerType:
          type: string
          enum:
          - CONSUMABLES
          - LICENSE
        quantity:
          type: integer
          format: int32
      title: CommitmentQuantity
    ResellerChangeExecutionDto:
      type: object
      properties:
        customerId:
          type: string
      title: ResellerChangeExecutionDto
    SubscriptionResource:
      type: object
      properties:
        autoRenewal:
          $ref: '#/components/schemas/AutoRenewal'
        creationDate:
          type: string
          example: yyyy-MM-dd'T'HH:mm:ss'Z'
        currentQuantity:
          type: integer
          format: int32
        links:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLink'
        offerId:
          type: string
        renewalDate:
          type: string
          example: yyyy-MM-dd
        status:
          type: string
        subscriptionId:
          type: string
        usedQuantity:
          type: integer
          format: int32
      title: SubscriptionResource
    ResourceLink:
      type: object
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Pair_string_string'
        method:
          type: string
        uri:
          type: string
      title: ResourceLink
  securitySchemes:
    authorization:
      type: apiKey
      name: authorization
      in: header
    x-api-key:
      type: apiKey
      name: x-api-key
      in: header
