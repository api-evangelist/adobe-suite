    get:
      summary: Get session informatio
      operationId: session
      responses:
        '200':
          description: Great Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessionID:
                        type: string
                      userID:
                        type: string
                      userCompanyID:
                        type: string
                      isAdmin:
                        type: boolean
                      timeZone:
                        type: string
                      timeZoneName:
                        type: string
                      locale:
                        type: string
                      iso3Country:
                        type: string
                      iso3Language:
                        type: string
                      customerID:
                        type: string
                      tenantID:
                        type: string
                      hasInsightsAccess:
                        type: boolean
                      currency:
                        type: object
                        properties:
                          ID:
                            type: string
                          symbol:
                            type: string
                          groupingSeparator:
                            type: string
                          decimalSeparator:
                            type: string
                          fractionDigits:
                            type: number
                            format: int32
                          useNegativeSign:
                            type: boolean
                      versionInformation:
                        type: object
                        properties:
                          version:
                            type: string
                          release:
                            type: string
                          buildNumber:
                            type: string
                          lastUpdated:
                            type: string
                            format: date-time
                          currentAPI:
                            type: number
                            format: int32
                          apiVersions:
                            type: object
                            additionalProperties:
                              type: string
      tags:
      - Session
      security:
      - ApiKeyHeader: []
      - SessionIDHeader: []
      - AtTaskCookie: []
      - WFAuthCookie: []
    servers:
