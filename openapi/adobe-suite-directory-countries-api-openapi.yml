openapi: 3.2.0
info:
  title: Adobe Suite Directory/countries API
  version: 2.4.6
  description: 'Operations tagged directory/countries across 2 of this provider''s published API definitions: adobe-suite-commerce-rest-customer-openapi.yaml, adobe-suite-commerce-rest-guest-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://example.com/rest/default
tags:
- name: directory/countries
paths:
  /V1/directory/countries:
    get:
      tags:
      - directory/countries
      description: Get all countries and regions information for the store.
      operationId: GetV1DirectoryCountries
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/directory-data-country-information-interface'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/directory-data-country-information-interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
      summary: directory/countries
    servers:
    - url: https://example.com/rest/default
