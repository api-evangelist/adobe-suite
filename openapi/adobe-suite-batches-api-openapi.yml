  /batch/{batchId}/cancel:
    post:
      tags:
      - Batches
      summary: Cancel a batch
      description: 'Cancel a batch job that is currently pending or running.


        Once cancelled, no new assets will be processed. Assets currently being

        processed may complete. The batch status will be updated to ''cancelled''.


        Cannot cancel batches that are already completed, failed, or cancelled.

        '
      operationId: cancelBatch
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - name: batchId
        in: path
        required: true
        description: Batch identifier.
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers:
            api-version:
              $ref: '#/components/headers/ApiVersionResponse'
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                  status:
                    type: string
                    enum:
                    - cancelled
                  message:
                    type: string
                  previousStatus:
                    type: string
                  assets:
                    $ref: '#/components/schemas/BatchAssetCounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: https://run-workflow.adobe.io
      description: Production
  /batch/{batchId}/executions:
    get:
      tags:
      - Batches
      summary: List individual execution results
      description: 'List all individual asset execution results within a batch, with optional filtering.


        Returns detailed results for each asset including:

        - Execution status (pending, running, success, failed)

        - Input asset data

        - Output results (if successful)

        - Error messages (if failed)

        - Timing information


        The response supports pagination and filtering by execution status.

        '
      operationId: listBatchExecutions
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - name: batchId
        in: path
        required: true
        description: Batch identifier.
        schema:
          type: string
      - name: status
        in: query
        description: Filter by execution status.
        schema:
          type: string
          enum:
          - pending
          - running
          - success
          - failed
      - name: limit
        in: query
        description: Maximum number of results (default 100).
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: offset
        in: query
        description: Pagination offset (default 0).
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Success
          headers:
            api-version:
              $ref: '#/components/headers/ApiVersionResponse'
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                  total:
                    type: integer
                    description: Total number of assets in batch.
                  executions:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchExecutionResult'
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      count:
                        type: integer
                      hasMore:
                        type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
