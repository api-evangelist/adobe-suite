        schema:
          type: string
      - name: documentProviderID
        in: query
        description: documentProviderID
        required: false
        schema:
          type: string
      - name: searchString
        in: query
        description: searchString
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: limit
        required: false
