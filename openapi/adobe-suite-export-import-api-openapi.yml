        - https://ns.adobe.com/xdm/context/profile
        meta:xdmType: object
        meta:class: https://ns.adobe.com/xdm/context/profile
        meta:sandboxId: ff0f6870-c46d-11e9-8ca3-036939a64204
        meta:sandboxType: production
    notFoundError:
