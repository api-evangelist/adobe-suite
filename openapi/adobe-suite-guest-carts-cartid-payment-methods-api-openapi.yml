openapi: 3.2.0
info:
  title: Adobe Suite Guest Carts/{cart Id}/payment Methods API
  version: 2.4.6
  description: 'Operations tagged guest-carts/{cartId}/payment-methods across 2 of this provider''s published API definitions: adobe-suite-commerce-rest-customer-openapi.yaml, adobe-suite-commerce-rest-guest-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://example.com/rest/default
tags:
- name: guest-carts/{cartId}/payment-methods
paths:
  /V1/guest-carts/{cartId}/payment-methods:
    get:
      tags:
      - guest-carts/{cartId}/payment-methods
      description: List available payment methods for a specified shopping cart. This call returns an array of objects, but detailed information about each object’s attributes might not be included.  See https://devdocs.magento.com/codelinks/attributes.html#GuestPaymentMethodManagementInterface to determine which call to use to get detailed information about all attributes for an object.
      operationId: GetV1GuestcartsCartIdPaymentmethods
      parameters:
      - name: cartId
        in: path
        required: true
        description: The cart ID.
        schema:
          type: string
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                type: array
                description: Array of payment methods.
                items:
                  $ref: '#/components/schemas/quote-data-payment-method-interface'
            application/xml:
              schema:
                type: array
                description: Array of payment methods.
                items:
                  $ref: '#/components/schemas/quote-data-payment-method-interface'
        '400':
          description: 400 Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
      summary: guest-carts/{cartId}/payment-methods
    servers:
    - url: https://example.com/rest/default
