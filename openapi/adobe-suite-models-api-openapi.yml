components:
  schemas:
    LinkObject:
      required:
      - href
      type: object
      properties:
        href:
          type: string
          description: Either an URI (RFC3986) or an URI Template (RFC6570) in which case the linkObject SHOULD have a 'templated' attribute whose value is true
        templated:
          type: boolean
          description: True if the link href is templated, false otherwise which is also the default
          default: false
        type:
          type: string
          description: A hint to indicate the media type expected when dereferencing the target resource
        method:
          type: string
          description: The HTTP method to be applied when using this link. This should be a valid HTTP method name such as GET, PUT, POST, PATCH, DELETE where GET implies support for HEAD as well
          default: GET
        title:
          type: string
          description: A label with a human-readable identifier (as defined by RFC5988)
        hrefLang:
          type: string
          description: The language of the target resource (as defined by RFC5988)
    Model:
      allOf:
      - $ref: '#/components/schemas/ModelSummary'
      - type: object
        properties:
          tags:
            type: object
            additionalProperties:
              type: string
    PagingNavigationAttributes:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/LinkObject'
        page:
          $ref: '#/components/schemas/LinkObject'
    ModelTranscodingListingLinks:
      allOf:
      - $ref: '#/components/schemas/PagingNavigationAttributes'
      - type: object
        properties:
          self:
            $ref: '#/components/schemas/LinkObject'
          createService:
            $ref: '#/components/schemas/LinkObject'
    ModelTranscodingListing:
      type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ModelTranscodingSummary'
        _page:
          $ref: '#/components/schemas/PagingInformationAttributes'
        _links:
          $ref: '#/components/schemas/ModelTranscodingListingLinks'
    ModelTranscoding:
      allOf:
      - $ref: '#/components/schemas/ModelTranscodingSummary'
      - type: object
        properties:
          _links:
            type: object
            properties:
              self:
                $ref: '#/components/schemas/LinkObject'
              getModelTranscoding:
                $ref: '#/components/schemas/LinkObject'
    SenseiApiResponse:
      type: object
      properties:
        type:
          type: string
          readOnly: true
          example: https://platform.adobe.io/data/foundation/ml/problems/illegal-argument
        title:
          type: string
          readOnly: true
          example: Illegal Argument
        status:
          type: integer
          format: int32
          readOnly: true
          example: 400
        detail:
          type: string
          readOnly: true
          example: Model specification name must not be empty
        additionalDetails:
          type: object
          additionalProperties:
            type: string
    ModelListingLinks:
      allOf:
      - $ref: '#/components/schemas/PagingNavigationAttributes'
      - type: object
        properties:
          self:
            $ref: '#/components/schemas/LinkObject'
          createModel:
            $ref: '#/components/schemas/LinkObject'
    ModelSummary:
      required:
      - experimentRunId
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        experimentId:
          type: string
        experimentRunId:
          type: string
        description:
          type: string
        modelArtifactUri:
          type: string
        state:
          type: array
          items:
            type: string
            enum:
            - trained
            - published
            - transcoded
        created:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: object
          properties:
            displayName:
              type: string
            avatar:
              type: string
            userId:
              type: string
        updated:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          default: false
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/LinkObject'
    ModelTranscodingSummary:
      required:
      - modelId
      type: object
      properties:
        id:
          type: string
        modelId:
          type: string
        targetFormat:
          type: string
          enum:
          - CoreML
          - TF
          - K2
          - Deepnet
        created:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: object
          properties:
            displayName:
              type: string
            avatar:
              type: string
            userId:
              type: string
        updated:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          default: false
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/LinkObject'
    PagingInformationAttributes:
      type: object
      properties:
        orderby:
          type: string
          readOnly: true
        property:
          type: string
          readOnly: true
        start:
          type: string
          readOnly: true
        totalCount:
