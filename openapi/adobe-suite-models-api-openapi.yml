          format: int64
          readOnly: true
        count:
          type: integer
          format: int64
          readOnly: true
        next:
          type: string
          readOnly: true
    ModelListing:
      type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'
