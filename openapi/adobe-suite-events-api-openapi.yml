components:
  schemas:
    ApiUnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: Invalid token (1)
          description: Error during authentication
    UploadedFileInfo:
      type: object
      properties:
        file_id:
          type: string
          example: 9c99f999-fca9-999c-9c99-b99aaec99e99
          description: The file ID as a GUID
        visitor_group_id:
          type: string
          example: myvisitorgroup1
          description: The visitor group of the file
        size:
          type: integer
          format: int64
          example: 355600
          description: The size of the compressed file in bytes
        received_date:
          type: integer
          format: int64
          example: 1506999999
          description: The date the file was uploaded in unix epoch time.
        processing_start_date:
          type: integer
          format: int64
          example: 1506999999
          description: The starting date for processing, in unix epoch time.
        processing_end_date:
          type: integer
          format: int64
          example: 1506999999
          description: The date all hits were submitted for Analytics, in unix epoch time.
        file_reader_complete_date:
          type: integer
          format: int64
          example: 1506999999
          description: The date the file was completely read, but the hits not yet submitted, in unix epoch time.
        rows:
          type: integer
          format: int64
          example: 10000
          description: The number of rows in the file
        invalid_rows:
          type: integer
          format: int64
          example: 42
          description: The number of rows not submitted to analytics for being invalid
        upload_name:
          type: string
          example: myfile1.gz
          description: The file name as it was uploaded
        status:
          type: string
          description: The status of the file
        status_code:
          type: string
          example: UPLOADED
          description: The status of the file as a short name
          enum:
          - REJECTED
          - UPLOADED
          - PROCESSING
          - COMPLETE
          - ERROR
        processing_log:
          type: string
          description: A log of errors produced while processing the file
        error:
          type: string
          example: File not in GZIP format
          description: An error message for unsuccessful requests
        success:
          type: string
          example: File is valid
          description: A success message for validation requests
    ApiError:
      type: object
      properties:
        error:
          type: string
          example: Request is missing required header 'x-adobe-vgid'
          description: General request error is encountered
    MaintenanceDto:
      title: MaintenanceDto
      type: object
      properties:
        clouds:
          type: array
          items:
            $ref: '#/components/schemas/EventCloud'
        completedOn:
          type: string
        environment:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvironment'
        id:
          type: string
        maintenanceType:
          type: string
          enum:
          - Empty
          - Normal
          - Scheduled
          - Urgent
        offering:
          type: array
          items:
            $ref: '#/components/schemas/EventOfferingDto'
        products:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceProductDto'
        region:
          type: array
          items:
            $ref: '#/components/schemas/EventRegion'
        reminderDate:
          uniqueItems: true
          type: array
          items:
            type: string
        scheduledDate:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/EventServices'
        startedOn:
          type: string
        status:
          type: string
          enum:
          - Canceled
          - Completed
          - Empty
          - Scheduled
          - Started
    EventCloud:
      title: EventCloud
      type: object
      properties:
        cloudProducts:
          uniqueItems: true
          type: array
          items:
            type: string
        id:
          type: string
        name:
          type: string
    EventEnvironment:
      title: EventEnvironment
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        serviceRegions:
          uniqueItems: true
          type: array
          items:
            type: string
    LocationImpact:
      title: LocationImpact
      type: object
      properties:
        serviceEnvironments:
          uniqueItems: true
          type: array
          items:
            type: string
        serviceRegions:
          uniqueItems: true
          type: array
          items:
            type: string
    MaintenanceProductDto:
      title: MaintenanceProductDto
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceHistoryEvent'
        id:
          type: string
        name:
          type: string
    IncidentDto:
      title: IncidentDto
      type: object
      properties:
        clouds:
          type: array
          items:
            $ref: '#/components/schemas/EventCloud'
        environment:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvironment'
        id:
          type: string
        offering:
          type: array
          items:
            $ref: '#/components/schemas/EventOfferingDto'
        products:
          type: array
          items:
            $ref: '#/components/schemas/IncidentProductDto'
        region:
          type: array
          items:
            $ref: '#/components/schemas/EventRegion'
        services:
          type: array
          items:
            $ref: '#/components/schemas/EventServices'
    IncidentHistoryEventDto:
      title: IncidentHistoryEventDto
      type: object
      properties:
        cfsId:
          type: string
        cfsSource:
          type: string
        cfsURL:
          type: string
        customerImpact:
          type: string
          enum:
          - Most
          - None
          - Some
          - Unknown
        id:
          type: string
        locationImpact:
          $ref: '#/components/schemas/LocationImpact'
        messageTime:
          type: string
        messageToken:
          type: string
        messageType:
          type: string
          enum:
          - CFS
          - Canned
          - Custom
          - None
        operationsImpact:
          type: string
          enum:
          - Availability
          - None
          - Performance
          - Unknown
        serviceImpact:
          $ref: '#/components/schemas/ImpactedServices'
        severity:
          type: string
          enum:
          - Major
          - Minor
          - None
          - Potential
          - Trivial
        showEnvironment:
          type: boolean
        status:
          type: string
          enum:
          - Closed
          - Discovery
          - Dismissed
          - None
          - Opened
        titleToken:
          type: string
    MaintenanceHistoryEvent:
      title: MaintenanceHistoryEvent
      required:
      - customerImpact
      - messageType
      - operationsImpact
      - showEnvironment
      - status
      type: object
      properties:
        customerImpact:
          type: string
          enum:
          - Most
          - None
          - Some
          - Unknown
        id:
          type: string
        locationImpact:
          $ref: '#/components/schemas/LocationImpact'
        messageTime:
          minimum: 1
          type: integer
          format: int64
        messageToken:
          type: string
        messageType:
          type: string
          enum:
          - Canned
          - Custom
        operationsImpact:
          type: string
          enum:
          - Availability
          - None
          - Performance
          - Unknown
        serviceImpact:
          $ref: '#/components/schemas/ImpactedServices'
        showEnvironment:
          type: boolean
        status:
          type: string
          enum:
          - Cancelled
          - Completed
          - Empty
          - Scheduled
          - Started
          - Updated
        titleToken:
          type: string
    EventServices:
      title: EventServices
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        serviceEnvironments:
          uniqueItems: true
          type: array
          items:
            type: string
    ImpactedServices:
      title: ImpactedServices
      type: object
      properties:
        productCapabilities:
          uniqueItems: true
          type: array
          items:
            type: string
        productOfferings:
          uniqueItems: true
          type: array
          items:
            type: string
        productServices:
          uniqueItems: true
          type: array
          items:
            type: string
    EventOfferingDto:
      title: EventOfferingDto
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        productServices:
          uniqueItems: true
          type: array
          items:
            type: string
    Event:
      title: Event
      type: object
      properties:
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentDto'
        maintenances:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceDto'
    IncidentProductDto:
      title: IncidentProductDto
      type: object
      properties:
        endedOn:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/IncidentHistoryEventDto'
        id:
          type: string
        name:
          type: string
        severity:
          type: string
          enum:
          - Major
          - Minor
          - None
