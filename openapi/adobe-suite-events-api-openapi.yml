openapi: 3.2.0
info:
  title: Adobe Suite Events API
  version: '1.0'
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: adobe-suite-analytics-bulk-data-insertion-openapi.json, adobe-suite-status-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://analytics.adobe.io/api
- url: https://status.adobe.io/
tags:
- name: Events
paths:
  /{globalCompanyId}/bulk_data_insertion/events:
    post:
      tags:
      - Events
      summary: Upload file for processing
      description: "Upload a batch file to Analytics for processing. Uploaded files must:\n * Be 100 MB or less compressed (using gzip)\n* Follow the CSV formatting rules and include the required fields as specified in the documentation"
      operationId: filePost
      parameters:
      - name: globalCompanyId
        in: path
        description: The Global Company ID for the Adobe Analytics organization
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/x-api-key'
      - name: x-adobe-vgid
        in: header
        description: Visitor Group ID. A visitor group represents a bucketed group of visitor IDs that are separate from any other visitor group set. The Group ID is a string of any valid value, but must be consistent across files. See [Vistior groups] (https://developer.adobe.com/analytics-apis/docs/2.0/guides/endpoints/bulk-data-insertion/visitor-groups/) for more information.
        required: true
        schema:
          type: string
      - name: debug
        in: query
        description: Store debug information for the first 10 hits of the file
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFileInfo'
        '400':
          description: Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized Access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Gzip compressed CSV file sent with request
                  format: binary
              required:
              - file
    servers:
    - url: https://analytics.adobe.io/api
  /{globalCompanyId}/bulk_data_insertion/events/validate:
    post:
      tags:
      - Events
      summary: Upload file for validation
      description: Upload batch file for Analytics validation. This file is not stored on the server or processed into Analytics. Validation is only for testing file format.
      operationId: fileValidatePut
      parameters:
      - name: globalCompanyId
        in: path
        description: The Global Company ID for the Adobe Analytics organization
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/x-api-key'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFileInfo'
        '400':
          description: Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized Access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUnauthorizedError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Gzip compressed CSV file sent with request
                  format: binary
              required:
              - file
    servers:
    - url: https://analytics.adobe.io/api
  /api/v1/events:
    get:
      tags:
      - Events
      summary: All Events
      description: List all ongoing issues and maintenances that are impacting Adobe Products and Services.
      operationId: eventsUsingGET
      parameters:
      - name: cloudIds
        in: query
        description: List of cloud ids for which you want to retrieve the events.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: environmentIds
        in: query
        description: List of environmentIds for which you want to retrieve the events.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: from
        in: query
        description: Retrieve the events starting from Date (yyyy-MM-dd format).
        schema:
          type: string
          format: date
      - name: offeringIds
        in: query
        description: List of offeringIds for which you want to retrieve the events.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: productIds
        in: query
        description: List of product ids for which you want to retrieve the events.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: regionIds
        in: query
        description: List of regionIds for which you want to retrieve the events.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: search
        in: query
        description: Product name search
        schema:
          type: string
      - name: serviceIds
        in: query
        description: List of serviceIds for which you want to retrieve the events.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: to
        in: query
        description: Retrieve the events till Date (yyyy-MM-dd format).
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden
          content: {}
        '404':
          description: Not Found
          content: {}
        '429':
          description: Too Many Requests
          content: {}
        '500':
          description: Internal Server Error
          content: {}
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: 'curl --location --request GET ''https://status.adobe.io/api/v1/events?api_key=<key>&cloudIds=<string>&environmentIds=<string>&from=<date>&offeringIds=<string>&productIds=<string>&regionIds=<string>&search=<string>&serviceIds=<string>&to=<date>'' \ --header ''Authorization: Bearer <token>'''
      - lang: JavaScript
        label: JavaScript
        source:
          $ref: code/JS/event.js
      - lang: JavaScript
        label: NodeJS
        source:
          $ref: code/Node/event.js
      security:
      - Authorization: []
        api_key: []
    servers:
    - url: https://status.adobe.io/
