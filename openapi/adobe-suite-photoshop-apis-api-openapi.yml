          - document_bounds
          - layer_bounds
        destination:
          oneOf:
          - $ref: '#/components/schemas/CreativeCloudDestination'
          - $ref: '#/components/schemas/EmbeddedDestination'
          - $ref: '#/components/schemas/HostedDestination'
          - $ref: '#/components/schemas/UrlDestination'
