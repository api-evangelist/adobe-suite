        maxWidth:
          minimum: 0
          type: integer
          description: Maximum width constraint in pixels. Must be >= 0. If specified and (width > maxWidth OR documentWidth > maxWidth), the output will be constrained to maxWidth. Optional.
          format: int32
        mediaType:
          type: string
          description: Supported media types for output
          default: image/jpeg
          enum:
          - image/jpeg
          - image/png
          - image/tiff
          - image/vnd.adobe.photoshop
          - document/vnd.adobe.cpsd+dcxucf
          - document/vnd.adobe.cpsd+dcx
          - application/json
