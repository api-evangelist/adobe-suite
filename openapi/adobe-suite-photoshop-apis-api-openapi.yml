          - bilinear
          - bicubic
          - bicubic_smoother
          - bicubic_sharper
        scriptOutputPattern:
          maxLength: 255
          minLength: 0
          type: string
          description: 'Pattern for matching script output files in the UXP output directory. Supports both exact filenames and glob patterns. Examples: ''output.json'' (matches single specific file), ''*.json'' (matches all JSON files), ''result-*.png'' (matches result-1.png, result-2.png, etc.). Files are filtered based on the mediaType of this output definition. Only files with extensions matching the mediaType will be included. When a pattern matches multiple files, one output entry is created per file. When present, skips normal rendering/export and uses matched files instead. Output parameters like quality, compression, width, and height are ignored when this field is present. Only applicable for /v2/execute-actions endpoint. Optional, nullable.'
        shouldOverwrite:
          type: boolean
          description: Whether to overwrite existing files. Optional.
