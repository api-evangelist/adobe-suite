openapi: 3.2.0
info:
  title: Adobe Suite Guest Carts/{cart Id} API
  version: 2.4.6
  description: 'Operations tagged guest-carts/{cartId} across 2 of this provider''s published API definitions: adobe-suite-commerce-rest-customer-openapi.yaml, adobe-suite-commerce-rest-guest-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://example.com/rest/default
tags:
- name: guest-carts/{cartId}
paths:
  /V1/guest-carts/{cartId}:
    get:
      tags:
      - guest-carts/{cartId}
      description: Enable a guest user to return information for a specified cart.
      operationId: GetV1GuestcartsCartId
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quote-data-cart-interface'
            application/xml:
              schema:
                $ref: '#/components/schemas/quote-data-cart-interface'
        '400':
          description: 400 Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
      summary: guest-carts/{cartId}
    put:
      tags:
      - guest-carts/{cartId}
      description: Assign a specified customer to a specified shopping cart.
      operationId: PutV1GuestcartsCartId
      parameters:
      - name: cartId
        in: path
        required: true
        description: The cart ID.
        schema:
          type: string
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                type: boolean
            application/xml:
              schema:
                type: boolean
        '401':
          description: 401 Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
      summary: guest-carts/{cartId}
      requestBody:
        content:
          application/json:
            schema:
              required:
              - customerId
              - storeId
              properties:
                customerId:
                  type: integer
                  description: The customer ID.
                storeId:
                  type: integer
              type: object
              xml:
                name: request
          application/xml:
            schema:
              required:
              - customerId
              - storeId
              properties:
                customerId:
                  type: integer
                  description: The customer ID.
                storeId:
                  type: integer
              type: object
              xml:
                name: request
    servers:
    - url: https://example.com/rest/default
