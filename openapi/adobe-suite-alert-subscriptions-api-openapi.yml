              example: true
            emailNotifications:
              type: boolean
              description: A `true` value indicates that the users want to receive an alert via email. A `false` value means that the users will not be sent alerts via email. To receive email alerts you must first enable this setting within the UI. See the documentation for [instructions on how to enable email alerts](https://experienceleague.adobe.com/docs/experience-platform/observability/alerts/ui.html?lang=en#enable-email-alerts).
              example: true
          description: This object provides the details of the users that you want to receive the alert, including the preferred delivery method. You must include their email ID and preferred notification channels for the alerts.
