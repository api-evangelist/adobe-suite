            method:
              type: string
              description: The HTTP method to use.
              example: PATCH
            body:
              type: string
              description: The JSON body to send.
              example: '{ \"op\": \"replace\", \"path\": \"/status\", \"value\": \"enable/disable\" }'
          description: An object that contains the method and URI required to update the status of an alert for a given `assetId` and `alertType` between `enable` and `disable`.
