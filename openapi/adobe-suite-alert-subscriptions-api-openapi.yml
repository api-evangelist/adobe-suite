        delete:
          type: object
          properties:
            href:
              type: string
              description: The URI to delete an alert for particular `assetId` and `alertType`.
              example: https://platform.adobe.io/data/foundation/query/alert-subscriptions/c4f67291-1161-4943-bc29-8736469bb928/failure
            method:
              type: string
              description: The HTTP method to use.
              example: DELETE
          description: An object that contains the method and URI required to delete an alert for particular `assetId` and `alertType`.
