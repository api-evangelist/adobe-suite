                    requestId: JG5rthQiyy8Ca0Y0WnCbhCu6Rh2PT6bg
                    errors:
                      400:
                      - code: 400
                        message: The audience cannot be deleted.
                    type: https://ns.adobe.com/aep/errors/UPAPI-113631-403
                    title: The audience cannot be deleted.
                    status: 400
        403:
