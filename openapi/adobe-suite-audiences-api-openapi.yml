        204:
          x-summary: Success
          description: The audience was successfully deleted. No message is returned upon a successful response.
          content:
            application/json:
              schema:
                type: object
        400:
          x-summary: Error
          description: The audience could not be deleted.
          content:
            application/json:
              schema:
                type: object
              examples:
