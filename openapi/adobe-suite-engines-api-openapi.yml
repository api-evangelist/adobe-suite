components:
  schemas:
    LinkObject:
      required:
      - href
      type: object
      properties:
        href:
          type: string
          description: Either an URI (RFC3986) or an URI Template (RFC6570) in which case the linkObject SHOULD have a 'templated' attribute whose value is true
        templated:
          type: boolean
          description: True if the link href is templated, false otherwise which is also the default
          default: false
        type:
          type: string
          description: A hint to indicate the media type expected when dereferencing the target resource
        method:
          type: string
          description: The HTTP method to be applied when using this link. This should be a valid HTTP method name such as GET, PUT, POST, PATCH, DELETE where GET implies support for HEAD as well
          default: GET
        title:
          type: string
          description: A label with a human-readable identifier (as defined by RFC5988)
        hrefLang:
          type: string
          description: The language of the target resource (as defined by RFC5988)
    MLEngineArtifact:
      required:
      - location
      - name
      - packagingType
      type: object
      properties:
        location:
          type: string
        reference:
          $ref: '#/components/schemas/ArtifactReference'
        name:
          type: string
        executionType:
          type: string
        packagingType:
          type: string
          default: docker
          enum:
          - docker
          - jar
          - egg
        metadata:
          type: object
          additionalProperties:
            type: object
            properties: {}
          readOnly: true
    EngineListing:
      type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/EngineSummary'
        _page:
          $ref: '#/components/schemas/PagingInformationAttributes'
        _links:
          $ref: '#/components/schemas/EngineListingLinks'
    ArtifactReference:
      required:
      - artifactId
      type: object
      properties:
        artifactId:
          type: string
        version:
          type: string
    PagingNavigationAttributes:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/LinkObject'
        page:
          $ref: '#/components/schemas/LinkObject'
    TaskSpec:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          enum:
          - ContainerTaskSpec
          - SparkTaskSpec
      description: Refer to ContainerTaskSpec and SparkTaskSpec definitions for the specific types of TaskSpec
      discriminator:
        propertyName: type
    MLInstanceTaskParameter:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        secret:
          type: boolean
      description: A parameter passed to an MLInstanceTask
    MLEngineArtifactOverride:
      required:
      - artifact
      - defaultMLInstanceConfigs
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        artifact:
          $ref: '#/components/schemas/MLEngineArtifact'
        defaultMLInstanceConfigs:
          $ref: '#/components/schemas/MLInstanceTask'
    MLInstanceTaskList:
      type: array
      items:
        $ref: '#/components/schemas/MLInstanceTask'
    Engine:
      allOf:
      - $ref: '#/components/schemas/EngineSummary'
      - type: object
        properties:
          artifacts:
            type: object
            properties:
              default:
                type: object
                properties:
                  image:
                    $ref: '#/components/schemas/MLEngineArtifact'
                  defaultMLInstanceConfigs:
                    $ref: '#/components/schemas/MLInstanceTaskList'
              overrides:
                type: array
                items:
                  $ref: '#/components/schemas/MLEngineArtifactOverride'
          tags:
            type: object
            additionalProperties:
              type: string
          _links:
            type: object
            properties:
              self:
                $ref: '#/components/schemas/LinkObject'
              getEngine:
                $ref: '#/components/schemas/LinkObject'
              createMLInstance:
                $ref: '#/components/schemas/LinkObject'
              listMLInstances:
                $ref: '#/components/schemas/LinkObject'
    SenseiApiResponse:
      type: object
      properties:
        type:
          type: string
          readOnly: true
          example: https://platform.adobe.io/data/foundation/ml/problems/illegal-argument
        title:
          type: string
          readOnly: true
          example: Illegal Argument
        status:
          type: integer
          format: int32
          readOnly: true
          example: 400
        detail:
          type: string
          readOnly: true
          example: Model specification name must not be empty
        additionalDetails:
          type: object
          additionalProperties:
            type: string
    MLInstanceTask:
      type: object
      properties:
        name:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/MLInstanceTaskParameter'
        specification:
          $ref: '#/components/schemas/TaskSpec'
        datasets:
          type: object
          properties:
            inputs:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  id:
                    type: string
                    format: urn
                  diskSizeInGB:
                    type: integer
                  resType:
                    type: string
                    enum:
                    - dataset
                    - model
                    - genericFile
                  downloadRequired:
                    type: boolean
                  refInput:
                    type: object
                    properties:
                      experimentRunId:
                        type: string
                      taskName:
                        type: string
                      outputName:
                        type: string
                  metadata:
                    type: object
                    additionalProperties:
                      type: object
                      properties: {}
            outputs:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  id:
                    type: string
                    format: urn
                  diskSizeInGB:
                    type: integer
                  resType:
                    type: string
                    enum:
                    - dataset
                    - model
                    - genericFile
                  uploadRequired:
                    type: boolean
                  generatedURI:
                    type: string
                  metadata:
                    type: object
                    additionalProperties:
                      type: object
                      properties: {}
      description: A single execution unit of Sensei
    EngineListingLinks:
      allOf:
      - $ref: '#/components/schemas/PagingNavigationAttributes'
      - type: object
        properties:
          self:
            $ref: '#/components/schemas/LinkObject'
          createEngine:
            $ref: '#/components/schemas/LinkObject'
    EnginesDockerRegistryInfo:
      type: object
      properties:
        host:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        password:
          type: string
          readOnly: true
    EngineSummary:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        documentationUrl:
          type: string
        type:
          type: string
        iconUrl:
          type: string
          description: Url of the thumbnail image
        gitRepo:
          type: string
        algorithm:
          type: string
        language:
          type: array
          items:
            type: string
            enum:
            - Python
            - Java
            - Scala
            - R
            - C++
        mlLibrary:
          type: string
        created:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: object
          properties:
            displayName:
              type: string
            avatar:
              type: string
            userId:
              type: string
        updated:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          default: false
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/LinkObject'
    PagingInformationAttributes:
      type: object
      properties:
        orderby:
          type: string
          readOnly: true
        property:
          type: string
          readOnly: true
        start:
          type: string
          readOnly: true
        totalCount:
          type: integer
          format: int64
          readOnly: true
        count:
          type: integer
          format: int64
          readOnly: true
        next:
          type: string
          readOnly: true
