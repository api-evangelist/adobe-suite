            schema:
              type: array
              items:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: ./UserNote.json
              - type: array
                items:
                  $ref: ./UserNote.json
      responses:
        '200':
          description: Great Success
