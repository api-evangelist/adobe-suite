          default: photo
          enum:
            - art
            - photo
        customModelId:
          description: 'ID of the custom model to be used for the generation. You can retrieve your custom model ID (assetId) with the Firefly retrieve custom model endpoint (https://developer.adobe.com/firefly-services/docs/firefly-api/api/#operation/getCustomModels).'
          type: string
        enableGroundPlane:
          description: Allow to enable the auto-generated ground plane under the hero asset. Useful if the 3D scene contains only a hero asset without additional elements. Disabled by default.
          type: boolean
          default: false
        environment:
          description: 'Optional environment settings used for all variations. If omitted, an environment will be generated based on the background. If set, the `lightingSeeds` parameter will be ignored.'
          $ref: '#/components/schemas/types.ComposeEnvironment'
        environmentExposure:
          description: 'Exposure, in EV (0=neutral).'
          type: number
          format: double
          maximum: 10
          minimum: -10
        heroAsset:
          description: Name of an existing 'hero asset' in the source 3D scene (the asset has to be defined in the scene).
          type: string
          minLength: 1
        lightingSeeds:
          description: 'LightingSeeds defines optional, fixed random seeds for reproducible Image-Based Lighting (IBL) when generating AI backgrounds. It is only used when ''environment'' is not provided. Each lighting seed maps to the corresponding background seed by index (first lighting seed with first background seed, etc.) when ''seeds'' is specified. If the number of lighting seeds does not match the number of background seeds, the slice is automatically truncated or padded with random values. When omitted or set to nil, random lighting seeds are generated. The actual seeds used are returned in the response payload.'
          type: array
          items:
            format: int64
            type: integer
          maxItems: 4
        modelVersion:
          description: 'Model version to be used to generate the background image with Adobe Firefly. If omitted, defaults to ''image3_fast''.'
          type: string
          default: image3_fast
          enum:
            - image3_fast
            - image4_standard
            - image4_ultra
        numVariations:
          description: 'The number of variations to generate. `numVariations` will default to the number of seeds, or to 1 if `seeds` is not specified.'
          type: integer
          format: int64
          maximum: 4
          minimum: 1
        prompt:
          description: Prompt to be used to generate the background image with Adobe Firefly.
          type: string
          minLength: 1
        scene:
          description: 'Optional scene-level details, such as a custom camera.'
          $ref: '#/components/schemas/types.ComposeSceneSceneDetails'
        sceneFile:
          description: 'The path of the scene file in `sources`. If value is null, the first found scene file will be used.'
          type: string
        seeds:
          description: 'Optional seed to be used to generate the background image with Adobe Firefly. Seed ensures consistent background image generation. If `seed` is not set, a random seed will be used. You will be able to retrieve the seed used for the generation in the output details of the job. If specified alongside `numVariations`, the number of seeds must be equal to `numVariations`.'
          type: array
          items:
            format: int64
            type: integer
          maxItems: 4
        size:
          description: |-
            Output image dimensions. Supported resolutions: 
              | Dimensions | Description | 
              | -----------| ----- |
              | { "width": 2048, "height": 2048} | Square (1:1) |
              | { "width": 2304, "height": 1792 } | Landscape (4:3) |
              | { "width": 1792, "height": 2304 } | Portrait (3:4) | 
              | { "width": 2688, "height": 1536 } | Widescreen (16:9) |
          $ref: '#/components/schemas/types.OutputSize'
        sources:
          description: List of sources to aggregate and run the job against.
          type: array
          items:
            $ref: '#/components/schemas/rest_base.MountedSource'
          maxItems: 16
          minItems: 1
        styleImage:
          description: Optional reference image to influence the visual style and aesthetics of the generated background. Must be provided in sources.
          type: string
      additionalProperties: false
      examples:
        - cameraName: main_camera
          heroAsset: bottle
          prompt: french style kitchen with a glass bottle sitting on an empty wooden table window on the left focal length 50mm
          sources:
            - url:
                url: 'https://cdn.substance3d.com/v2/files/public/compositing_table_bottle.glb'
      required:
        - sources
        - prompt
        - heroAsset
