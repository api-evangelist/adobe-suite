          format: double
          minimum: 0
      additionalProperties: false
      required:
        - azimuth
        - altitude
        - lookAt
        - radius
    types.BackgroundOptions:
      type: object
      properties:
        backgroundColor:
          description: 'RGBA background color. Has an effect only if `showEnvironment` is `false`. Each component has to be in the [0,1] range.'
          type:
            - array
            - 'null'
          items:
            format: double
            type: number
          default:
            - 0
            - 0
            - 0
            - 0
          examples:
            - - 0
              - 0
              - 0
              - 0
          maxItems: 4
          minItems: 4
        backgroundImage:
          description: 'Path to a background image. If set, will be used as the background.'
          type: string
        showEnvironment:
          description: Show the environment map as the background.
          type: boolean
          default: false
      additionalProperties: false
    types.CameraStats:
      type: object
      properties:
        aspectRatio:
          type: number
          format: double
        fStop:
          type: number
          format: double
        focalLength:
          type: number
          format: double
        focusDistance:
          type: number
          format: double
        horizontalAperture:
          type: number
          format: double
        horizontalApertureOffset:
          type: number
          format: double
        name:
          type: string
        projection:
          type: string
        verticalAperture:
          type: number
          format: double
        verticalApertureOffset:
          type: number
          format: double
      additionalProperties: false
      required:
        - name
        - focalLength
        - horizontalAperture
        - verticalAperture
        - aspectRatio
        - horizontalApertureOffset
        - verticalApertureOffset
        - fStop
        - focusDistance
        - projection
    types.ComposeEnvironment:
      type: object
      properties:
        file:
          description: 'Path of environment file in `sources`. If value is null, the environment file will be generated.'
          type: string
        rotation:
          description: Controls the orientation of the environment map.
          $ref: '#/components/schemas/types.Rotation'
      additionalProperties: false
      required:
        - file
    types.ComposeSceneSceneDetails:
      type: object
      properties:
        camera:
          description: Custom camera definition for the scene render. Mutually exclusive with 'cameraName' at the top level. Use this to define camera parameters programmatically instead of referencing a named camera from the 3D scene.
          $ref: '#/components/schemas/types.SceneCamera'
      additionalProperties: false
    types.ExportMasksOptions:
      type: object
      properties:
        selection:
          description: 'The list of masks to be exported, accepts glob expressions. If empty, all masks will be exported.'
          type:
            - array
            - 'null'
          items:
            type: string
      additionalProperties: false
    types.FormatOptions:
      type: object
      properties:
        usd:
          description: options specific to USD file format
          $ref: '#/components/schemas/types.UsdOptions'
      additionalProperties: false
      required:
        - usd
    types.GroundPlaneOptions:
      type: object
      properties:
        autoGroundScene:
          description: Automatically position the scene on the ground plane. Moves the scene along the vertical axis.
          type: boolean
          default: true
        enable:
          description: Enable/disable the ground plane.
          type: boolean
          default: true
        reflections:
          description: Enable/disable reflections onto the ground plane.
          type: boolean
          default: false
        reflectionsOpacity:
          description: Controls the opacity of the reflections. Useful for compositing purposes.
          type: number
          format: double
          default: 1
          maximum: 1
          minimum: 0
        reflectionsRoughness:
          description: Controls the roughness of the reflections. Useful for compositing purposes.
          type: number
          format: double
          default: 0
          maximum: 1
          minimum: 0
        shadows:
          description: Controls whether the ground plane catches shadows or not.
          type: boolean
          default: true
        shadowsOpacity:
          description: Controls the opacity of cast shadows. Only has effect if shadows are enabled.
          type: number
          format: double
          default: 1
          maximum: 1
          minimum: 0
      additionalProperties: false
    types.IdsMapData:
      type: object
      properties:
        fileName:
          description: The Ids map file name.
          type: string
        ids:
          description: List of name to color bindings.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.NameToColorBinding'
      additionalProperties: false
      required:
        - fileName
        - ids
    types.MaskNameToFileBinding:
      type: object
      properties:
        fileName:
          description: The file name.
          type: string
        name:
          description: The name in the 3D scene.
          type: string
      additionalProperties: false
      required:
        - name
        - fileName
    types.Material:
      type: object
      properties:
        sbs:
          description: The PBR material definition.
          $ref: '#/components/schemas/types.SbsMaterial'
        solidColor:
          description: The solid color material definition.
          $ref: '#/components/schemas/types.SolidColorMaterial'
      additionalProperties: false
    types.MaterialAssign:
      type: object
      properties:
        material:
          description: The material definition.
          $ref: '#/components/schemas/types.Material'
        materialName:
          description: 'Desired material name, it will be sanitized to make a valid USD prim name.'
          type: string
        nodeList:
          description: List of nodes under which geometric primitives will have this material assigned. Each entry can be a full node name or a glob expression.
          type:
            - array
            - 'null'
          items:
            type: string
        assignByDefault:
          description: Set to true to assign this material by default to all geometric primitives.
        excludeFromDefault:
          description: List of nodes to exclude from default assignment.
      additionalProperties: false
      required:
        - materialName
        - material
        - nodeList
    types.MaterialOverride:
      type: object
      properties:
        absorptionColorFactor:
          description: 'RGB float color value, for example white is [1.0,1.0,1.0].'
          type: array
          items:
            format: double
            type: number
          default:
            - 0
            - 0
            - 0
          maxItems: 3
          minItems: 3
        absorptionColorTexture:
          type: string
        absorptionDistanceFactor:
          type: number
          format: double
          minimum: 0
        absorptionDistanceTexture:
          type: string
        baseColorFactor:
          description: 'RGB float color value, for example white is [1.0,1.0,1.0].'
          type: array
          items:
            format: double
            type: number
          default:
            - 0
            - 0
            - 0
          maxItems: 3
          minItems: 3
        baseColorTexture:
          type: string
        coatColorFactor:
          description: 'RGB float color value, for example white is [1.0,1.0,1.0].'
          type: array
          items:
            format: double
            type: number
          default:
            - 0
            - 0
            - 0
          maxItems: 3
          minItems: 3
        coatColorTexture:
          type: string
        coatOpacityFactor:
          type: number
          format: double
          maximum: 1
          minimum: 0
        coatOpacityTexture:
          type: string
        coatRoughnessFactor:
          type: number
          format: double
          maximum: 1
          minimum: 0
        coatRoughnessTexture:
          type: string
        materialName:
          type: string
        metallicFactor:
          type: number
          format: double
          maximum: 1
          minimum: 0
        metallicTexture:
          type: string
        normalFactor:
          type: array
          items:
            format: double
            type: number
          maxItems: 3
          minItems: 3
        normalTexture:
          type: string
        opacityFactor:
          type: number
          format: double
          minimum: 0
        opacityTexture:
          type: string
        pbrMaterial:
          $ref: '#/components/schemas/types.SbsMaterial'
        roughnessFactor:
          type: number
          format: double
          maximum: 1
          minimum: 0
        roughnessTexture:
          type: string
        translucencyFactor:
          type: number
          format: double
          maximum: 1
          minimum: 0
        translucencyTexture:
          type: string
        volumeThicknessFactor:
          type: number
          format: double
          minimum: 0
        volumeThicknessTexture:
          type: string
      additionalProperties: false
      required:
        - materialName
    types.NameToColorBinding:
      type: object
      properties:
        color:
          description: Corresponding color in the ID map.
          type: string
          default:
            - 0
            - 0
            - 0
          contentEncoding: base64
        name:
          description: Name in 3D scene.
          type: string
      additionalProperties: false
      required:
        - name
        - color
    types.OutputSize:
      type: object
      properties:
        height:
          type: integer
          format: int64
          default: 1536
          maximum: 2688
          minimum: 1
        width:
          type: integer
          format: int64
          default: 2688
          maximum: 2688
          minimum: 1
      additionalProperties: false
      required:
        - width
        - height
    types.RenderExtraOutputExportMatte:
      type: object
      properties:
        includeNodes:
          description: 'Nodes to be included into the matte, the list can contain glob patterns. If empty, the matte will contain all scene objects.'
          type:
            - array
            - 'null'
          items:
            type: string
      additionalProperties: false
      required:
        - includeNodes
    types.RenderExtraOutputs:
      type: object
      properties:
        exportDistanceToCamera:
          description: export a distance-to-camera map as a NumPy .npy file (float32 2D array)
          type: boolean
          default: false
        exportMaterialIds:
          description: Export an image with one color per material.
          type: boolean
          default: false
        exportMaterialMasks:
          description: Export one mask per material.
          $ref: '#/components/schemas/types.ExportMasksOptions'
        exportMatte:
          description: export compositing matte for a selection of objects
          $ref: '#/components/schemas/types.RenderExtraOutputExportMatte'
        exportObjectIds:
          description: Export an image with one color per object.
          type: boolean
          default: false
        exportObjectMasks:
          description: Export one mask per object.
          $ref: '#/components/schemas/types.ExportMasksOptions'
      additionalProperties: false
    types.RendererConfig:
      type: object
      properties:
        type:
          description: Renderer to use. 'ssca' is the default path-tracing renderer; 'rtx' uses NVidia RTX renderer.
          type: string
          enum:
            - ssca
            - rtx
      additionalProperties: false
      required:
        - type
    types.Rotation:
      type: object
      properties:
        euler:
          description: Euler angles in degrees.
          type: array
          items:
            format: double
            type: number
          examples:
            - - 0
              - 0
              - 0
          maxItems: 3
          minItems: 3
        quaternion:
          description: 'In W,X,Y,Z order.'
          type: array
          items:
            format: double
            type: number
          examples:
            - - 1
              - 0
              - 0
              - 0
          maxItems: 4
          minItems: 4
      additionalProperties: false
    types.SbsMaterial:
      type: object
      properties:
        preset:
          description: Select a preset to be used for the substance material rendering.
          type: string
        resolution:
          description: Substance material render resolution. This should be a power of two.
          type: integer
          format: int64
          enum:
            - 16
            - 32
            - 64
            - 128
            - 256
            - 512
            - 1024
            - 2048
            - 4096
          maximum: 4096
          minimum: 16
        rotation:
          description: Texture space rotation.
          type: number
          format: double
        sbsar:
          description: 'Path to a substance material; if not set, the first substance 3D material found in sources will be used.'
          type: string
        scale:
          description: Texture space scale.
          type: array
          items:
            format: double
            type: number
          maxItems: 2
          minItems: 2
        translation:
          description: Texture space translation.
          type: array
          items:
            format: double
            type: number
          maxItems: 2
          minItems: 2
      additionalProperties: false
    types.SceneBaseFile:
      type: object
      properties:
        file:
          description: Path to the scene file in `sources`.
          type: string
        modelsRootNodeName:
          description: 'Define root node for models in scene graph. If not found, the node which is parent of all models in the scene will be used. If this node doesn''t exist, a new node will be created under global root.'
          type: string
      additionalProperties: false
      required:
        - file
    types.SceneCamera:
      type: object
      properties:
        focal:
          description: 'Camera focal length, in mm.'
          type: number
          format: double
          default: 50
          maximum: 1000
          minimum: 10
        sensorWidth:
          description: 'Camera sensor width, in mm.'
          type: number
          format: double
          default: 36
          maximum: 100
          minimum: 1
        transform:
          description: Controls the position and angle of the camera.
          $ref: '#/components/schemas/types.Transform'
      additionalProperties: false
    types.SceneDescription:
      type: object
      properties:
        baseFile:
          description: 'Define a scene from a file. If value is `null`, an empty scene will be created.'
          $ref: '#/components/schemas/types.SceneBaseFile'
        camera:
          description: Define a new camera for the scene.
          $ref: '#/components/schemas/types.SceneCamera'
        environment:
          description: Define the environment for the scene. Override the previous existing environment.
          $ref: '#/components/schemas/types.SceneEnvironment'
        formatOptions:
          description: define options specific for model file format
          $ref: '#/components/schemas/types.FormatOptions'
        materials:
          description: Assign new materials to geometric primitives.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.MaterialAssign'
        metersPerUnit:
          description: 'Length of a scene unit, in meters. Defaults to `baseFile` meters per unit if any, or 0.01 (centimeters) otherwise.'
          type: number
          format: double
          exclusiveMinimum: 0
        models:
          description: Define additional models for the scene.
          $ref: '#/components/schemas/types.SceneModels'
      additionalProperties: false
    types.SceneEnvironment:
      type: object
      properties:
        exposure:
          description: 'Exposure, in EV (0=neutral).'
          type: number
          format: double
          default: 0
          maximum: 10
          minimum: -10
        file:
          description: 'Path to the environment file in `sources`. If the value is `null`, the first found environment file will be used.'
          type: string
        preserveLights:
          description: 'A scene may contain 3D lights, like area lights or spot lights. By default, all those lights are removed when a new environment is set. Set this option to `true` to preserve the scene 3D lights.'
          type: boolean
          default: false
        rotation:
          description: Controls the orientation of the environment map.
          $ref: '#/components/schemas/types.Rotation'
      additionalProperties: false
    types.SceneModel:
      type: object
      properties:
        anchorName:
          description: 'Node name in scene graph which used as parent for the model. If anchor is not found, a node with the anchor name will be generated under models root node. And If value is `null`, a node will be generated under models root node.'
          type: string
        file:
          description: 'Path to the model file in `sources`. If the value is `null`, the first found model file will be used.'
          type: string
        formatOptions:
          description: Define options specific for the model file format.
          $ref: '#/components/schemas/types.FormatOptions'
        materialOverrides:
          description: Define material overrides.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.MaterialOverride'
        transform:
          description: 'Transform applied on the anchor node. Overrides the previous value, if it exists.'
          $ref: '#/components/schemas/types.Transform'
      additionalProperties: false
    types.SceneModels:
      type: object
      properties:
        imports:
          description: List of model import definitions.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.SceneModel'
        modelsRootNodeTransform:
          description: 'Global transformation applied on the models root node defined in the scene. Overrides the previous value, if it exists.'
          $ref: '#/components/schemas/types.Transform'
      additionalProperties: false
    types.SceneStatsBoundingBox:
      type: object
      properties:
        max:
          type:
            - array
            - 'null'
          items:
            format: double
            type: number
        min:
          type:
            - array
            - 'null'
          items:
            format: double
            type: number
      additionalProperties: false
      required:
        - min
        - max
    types.SceneStatsInfo:
      type: object
      properties:
        cameraNames:
          type:
            - array
            - 'null'
          items:
            type: string
        materialNames:
          type:
            - array
            - 'null'
          items:
            type: string
        metersPerSceneUnit:
          type: number
          format: double
        nodesHierarchy:
          $ref: '#/components/schemas/types.SceneStatsNode'
        numEquivalentTriangles:
          type: integer
          format: int64
        numExtraPolygons:
          type: integer
          format: int64
        numFaces:
          type: integer
          format: int64
        numLines:
          type: integer
          format: int64
        numMeshes:
          type: integer
          format: int64
        numPoints:
          type: integer
          format: int64
        numQuads:
          type: integer
          format: int64
        numSubMeshes:
          type: integer
          format: int64
        numTextures:
          type: integer
          format: int64
        numTriangles:
          type: integer
          format: int64
        numVertices:
          type: integer
          format: int64
        sceneUpAxis:
          type: string
      additionalProperties: false
      required:
        - metersPerSceneUnit
        - sceneUpAxis
        - numVertices
        - numEquivalentTriangles
        - numPoints
        - numLines
        - numTriangles
        - numQuads
        - numExtraPolygons
        - numFaces
        - numMeshes
        - numSubMeshes
        - numTextures
        - cameraNames
        - materialNames
        - nodesHierarchy
    types.SceneStatsNode:
      type: object
      properties:
        assignedMaterialName:
          type: string
        cameraStats:
          $ref: '#/components/schemas/types.CameraStats'
        children:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.SceneStatsNode'
        name:
          type: string
        type:
          type: string
        variants:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.SceneStatsNodeVariant'
        worldSpaceBoundingBox:
          $ref: '#/components/schemas/types.SceneStatsBoundingBox'
      additionalProperties: false
      required:
        - name
        - type
    types.SceneStatsNodeVariant:
      type: object
      properties:
        currentValue:
          type: string
        name:
          type: string
        values:
          type:
            - array
            - 'null'
          items:
            type: string
      additionalProperties: false
      required:
        - name
        - values
        - currentValue
    types.ShadowCatchingMaterial:
      type: object
      properties:
        reflectionOpacity:
          type: number
          format: double
          default: 0
        roughness:
          type: number
          format: double
          default: 0
        shadowOpacity:
          type: number
          format: double
          default: 0
      additionalProperties: false
      required:
        - reflectionOpacity
        - roughness
        - shadowOpacity
    types.SimpleSceneDescription:
      type: object
      properties:
        camera:
          description: Define a new camera for the scene.
          $ref: '#/components/schemas/types.SceneCamera'
        environment:
          description: Define the environment for the scene. Override the previous existing environment.
          $ref: '#/components/schemas/types.SceneEnvironment'
        formatOptions:
          description: Define options specific for the model file format.
          $ref: '#/components/schemas/types.FormatOptions'
        materialOverrides:
          description: Define material overrides.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.MaterialOverride'
        materials:
          description: Assign new materials to geometric primitives.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.MaterialAssign'
        metersPerUnit:
          description: 'Length of a scene unit, in meters. Defaults to 0.01 (centimeters).'
          type: number
          format: double
          exclusiveMinimum: 0
        modelFile:
          description: 'Path to the model file in `sources`. If the value is `null`, the first found model file will be used.'
          type: string
        modelTransform:
          description: Transform applied on the model.
          $ref: '#/components/schemas/types.Transform'
      additionalProperties: false
    types.SizeOptions:
      type: object
      properties:
        height:
          description: Render height.
          type: integer
          format: int64
          maximum: 2304
          minimum: 16
        width:
          description: Render width.
          type: integer
          format: int64
          maximum: 3840
          minimum: 16
      additionalProperties: false
      required:
        - width
        - height
    types.SolidColorMaterial:
      type: object
      properties:
        color:
          description: 'RGB color of the solid material, each component has to be in the [0,1] range.'
          type:
            - array
            - 'null'
          items:
            format: double
            type: number
          default:
            - 0
            - 0
            - 0
          maxItems: 3
          minItems: 3
        metallicFactor:
          description: 'Metallic factor of the solid material, has to be in the [0,1] range.'
          type: number
          format: double
          maximum: 1
          minimum: 0
        roughnessFactor:
          description: 'Roughness factor of the solid material, has to be in the [0,1] range.'
          type: number
          format: double
          maximum: 1
          minimum: 0
      additionalProperties: false
      required:
        - color
    types.TRS:
      type: object
      properties:
        rotation:
          $ref: '#/components/schemas/types.Rotation'
        scale:
          type:
            - array
            - 'null'
          items:
            format: double
            type: number
          maxItems: 3
          minItems: 3
        translation:
          type:
            - array
            - 'null'
          items:
            format: double
            type: number
          examples:
            - - 0
              - 0
              - 0
          maxItems: 3
          minItems: 3
      additionalProperties: false
      required:
        - translation
        - rotation
        - scale
    types.Transform:
      type: object
      properties:
        azimuthAltitude:
          description: 'Transform is defined by azimuth, altitude and radius terms. If set, do not set `matrix` or `trs`.'
          $ref: '#/components/schemas/types.AzimuthAltitude'
        matrix:
          description: 'Transform is defined as a matrix. If set, do not set `trs` or `azimuthAltitude`.'
          type: array
          items:
            format: double
            type: number
          maxItems: 16
          minItems: 16
        trs:
          description: 'Transform is defined by translation, rotation and scale terms. If set, do not set `matrix` or `azimuthAltitude`.'
          $ref: '#/components/schemas/types.TRS'
      additionalProperties: false
    types.UsdOptions:
      type: object
      properties:
        variants:
          description: List of USD variants definition applied on USD primitives.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/types.UsdVariant'
      additionalProperties: false
      required:
        - variants
    types.UsdVariant:
      type: object
      properties:
        primName:
          description: name of the USD prim on which the variant is defined
          type: string
        variant:
          description: name of the variant option to apply from the variant set
          type: string
        variantSet:
          description: name of the variant set to select from
          type: string
      additionalProperties: false
      required:
        - primName
        - variantSet
        - variant
    types.Warning:
      type: object
      properties:
        context:
          type: string
        message:
          type: string
      additionalProperties: false
      required:
        - context
        - message
  securitySchemes:
    bearerAuth:
      description: 'Adobe service-to-service (S2S) access token. Pass `Authorization: Bearer <Token>`. The token is not a JWT.'
      scheme: bearer
      type: http
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Your client ID, which acts as the API key. Pass `x-api-key: <API_KEY>` using `<API_KEY>` as the placeholder in examples.'
security:
  - bearerAuth: []
    ApiKeyAuth: []
