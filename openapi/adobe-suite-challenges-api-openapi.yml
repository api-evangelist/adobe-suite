components:
  schemas:
    ContentPhaseConfig:
      type: object
      description: Message sequence for a journey phase
      properties:
        messages:
          type: array
          description: Ordered list of messages for this phase
          items:
            $ref: '#/components/schemas/MessageConfig'
    Daypart:
      type: object
      properties:
        startMinute:
          type: integer
          format: int32
        endMinute:
          type: integer
          format: int32
    Reward:
      type: object
      properties:
        endpoint:
          type: string
        definition:
          type: string
        rewardValue:
          type: string
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
    ChallengeList:
      type: object
      properties:
        challengeList:
          type: array
          items:
            $ref: '#/components/schemas/Challenge'
    Variables:
      type: object
      properties:
        include:
          $ref: '#/components/schemas/IncludeExclude'
        exclude:
          $ref: '#/components/schemas/IncludeExclude'
        goal:
          type: number
          format: double
        type:
          type: string
        singleTrans:
          type: boolean
        spendMin:
          type: number
          format: float
        qtyMin:
          type: number
          format: float
        maxTrans:
          type: integer
          format: int32
    AudienceQualificationConfig:
      type: object
      description: Audience configuration for journey targeting
      properties:
        segmentName:
          type: string
          description: Human-readable segment name (optional, for documentation)
          example: High-Value Mobile Users
        segmentId:
          type: string
          description: Adobe Experience Platform segment/audience UUID
          example: 88e4300a-c762-4cd6-8bd0-c0c02ba9afcf
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      required:
      - segmentId
    Challenge:
      type: object
      properties:
        get_id:
          type: string
        imsOrgId:
          type: string
        sandboxId:
          type: string
        name:
          type: string
        desc:
          type: string
