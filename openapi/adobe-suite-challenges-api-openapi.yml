        kvpCustom:
          type: object
          additionalProperties:
            type: string
        uiStash:
          type: string
        createdBy:
          type: string
        lastModifiedBy:
          type: string
        journeyMetadata:
          $ref: '#/components/schemas/JourneyMetadata'
        milestones:
          $ref: '#/components/schemas/Milestone'
