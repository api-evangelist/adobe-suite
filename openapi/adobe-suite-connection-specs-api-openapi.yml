                  value:
                    id: 44c6e8ec-54e8-4813-a472-93c6cf29c3d7
                    createdAt: 1624299037286
                    updatedAt: 1624299037286
                    createdBy: acp_foundation_connectors@AdobeID
                    updatedBy: acp_foundation_connectors@AdobeID
