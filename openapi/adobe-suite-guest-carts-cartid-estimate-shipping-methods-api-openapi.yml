paths:
  /V1/guest-carts/{cartId}/estimate-shipping-methods:
    post:
      tags:
      - guest-carts/{cartId}/estimate-shipping-methods
      description: Estimate shipping by address and return list of available shipping methods
      operationId: PostV1GuestcartsCartIdEstimateshippingmethods
      parameters:
      - name: cartId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 Success.
          content:
            application/json:
              schema:
                type: array
                description: An array of shipping methods
                items:
                  $ref: '#/components/schemas/quote-data-shipping-method-interface'
            application/xml:
              schema:
                type: array
                description: An array of shipping methods
                items:
                  $ref: '#/components/schemas/quote-data-shipping-method-interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
            application/xml:
              schema:
                $ref: '#/components/schemas/error-response'
      summary: guest-carts/{cartId}/estimate-shipping-methods
      requestBody:
        content:
          application/json:
            schema:
              required:
              - address
              properties:
                address:
                  $ref: '#/components/schemas/quote-data-address-interface'
              type: object
              xml:
                name: request
          application/xml:
            schema:
              required:
              - address
              properties:
                address:
                  $ref: '#/components/schemas/quote-data-address-interface'
              type: object
              xml:
                name: request
    servers:
    - url: https://example.com/rest/default
