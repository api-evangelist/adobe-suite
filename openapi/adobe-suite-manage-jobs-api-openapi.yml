                type: object
              examples:
                ErrorBodyMethodNotAllowed:
                  summary: Method Not Allowed
                  value:
                    error_code: '405001'
                    message: The requested method is not allowed on this endpoint.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                description: Response indicating that the reframed video job has been successfully submitted.
                properties:
                  jobId:
                    type: string
                    description: The unique identifier for the job.
                  statusUrl:
                    type: string
                    description: The URL to monitor the status of the job.
                required:
                - jobId
                - statusUrl
                type: object
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                description: Response indicating that the reframed video job has been successfully submitted.
                properties:
                  jobId:
                    type: string
                    description: The unique identifier for the job.
                  statusUrl:
                    type: string
                    description: The URL to monitor the status of the job.
                required:
                - jobId
                - statusUrl
                type: object
              examples:
                ErrorBodyTooManyRequests:
                  summary: Too Many Requests
                  value:
                    message: Too Many Requests
                    error_code: '429011'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: Response indicating that the reframed video job has been successfully submitted.
                properties:
                  jobId:
                    type: string
                    description: The unique identifier for the job.
                  statusUrl:
                    type: string
                    description: The URL to monitor the status of the job.
                required:
                - jobId
                - statusUrl
                type: object
              examples:
                ErrorBodyInternalServerError:
                  summary: Internal Server Error
                  value:
                    error_code: '500001'
                    message: An internal server error occurred. Please try again later.
    servers:
    - url: https://audio-video-api.adobe.io
      description: Production server.
  /v3/status/{jobId}:
    get:
      operationId: jobResultV3
      summary: Get job status
      description: Get the status of an asynchronous job (including upscale jobs). When the job has completed successfully, the result reflects the operation type (for example generation, composite, or upscale).
      tags:
      - Manage jobs
      parameters:
      - name: jobId
        in: path
        required: true
