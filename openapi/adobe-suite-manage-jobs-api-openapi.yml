  schemas:
    StatusAPIInprogressResponse:
      type: object
      properties:
        jobId:
          type: string
        status:
          $ref: '#/components/schemas/StatusAPIResponseStatus'
    CancelAcceptedResponse:
      type: object
      description: Success response body returned with HTTP 202 when a render job cancel request is accepted. Applies only to render jobs submitted via `POST /v1/templates/render`.
      required:
      - jobId
      - status
      properties:
        jobId:
          type: string
          format: uuid
          description: UUID of the render job for which cancellation was accepted.
        status:
          type: string
          enum:
          - canceling
          description: Transient in-progress status. Poll `GET /v1/status/{jobId}` to observe the terminal `canceled` state.
    StatusAPICompletedResponse:
      type: object
      properties:
        jobId:
          type: string
        status:
          $ref: '#/components/schemas/StatusAPIResponseStatus'
        output:
          type: object
          properties:
            destination:
              $ref: '#/components/schemas/Destination'
    FailedResponse:
      type: object
      description: Generic error response object.
      properties:
        error_code:
          type: string
        message:
          type: string
    Destination:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The pre-signed URL pointing to the output destination.
      required:
      - url
      description: Destination details including a pre-signed URL for the output media.
    RenderJobListResponse:
      type: object
      description: Response body for `GET /v1/templates/render-jobs`. Contains render jobs submitted via `POST /v1/templates/render` only.
      required:
      - paging
      - jobs
      properties:
        paging:
          $ref: '#/components/schemas/PagingInfo'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/RenderJobListItem'
          description: Ordered list of render job summaries for the current page. Empty array when no jobs match the filter.
    ErrorResponse:
      type: object
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
          description: The error code returned with the response.
        message:
          type: string
          description: The error message returned with the response.
        messageId:
          type: string
          description: The error message ID returned with the response.
    StatusAPIResponse:
      type: object
      description: Response object for job status queries.
      oneOf:
      - $ref: '#/components/schemas/StatusAPIInprogressResponse'
      - $ref: '#/components/schemas/StatusAPICompletedResponse'
      - $ref: '#/components/schemas/StatusAPIFailedResponse'
      - $ref: '#/components/schemas/JobStatus'
    StatusAPIFailedResponse:
      type: object
      description: Response object for failed jobs.
      properties:
        status:
          $ref: '#/components/schemas/StatusAPIResponseStatus'
        jobId:
          type: string
        error_code:
          type: string
        message:
          type: string
    StatusAPIResponseStatus:
      type: string
      enum:
      - pending
      - running
      - failed
      - succeeded
      description: Status of the job.
    RenderJobListItem:
      type: object
      description: Summary of a single template render job as returned by `GET /v1/templates/render-jobs`. Applies only to render jobs submitted via `POST /v1/templates/render`.
      required:
      - jobId
      - status
      - totalJobItems
      - createdDate
      - statusUrl
      properties:
        jobId:
          type: string
          format: uuid
          description: Unique identifier of the render job.
        status:
          type: string
          enum:
          - not_started
          - running
          - succeeded
          - partially_succeeded
          - failed
          - canceled
          description: Current overall status of the render job.
        totalJobItems:
          type: integer
          description: Total number of output items (variation × preset combinations) in this batch render job.
        percentCompleted:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of the job completed (0–100). Present only when `status` is `running`.
        createdDate:
          type: string
          format: date-time
          description: ISO 8601 date-time when the render job was submitted.
        completedDate:
          type: string
          format: date-time
          description: ISO 8601 date-time when the job reached a terminal state. Present only when `status` is `succeeded`, `partially_succeeded`, `failed`, or `canceled`.
        statusUrl:
          type: string
          format: uri
          description: Absolute URL to poll for the latest job status (`GET /v1/status/{jobId}`).
        cancelUrl:
          type: string
          format: uri
          description: Absolute URL to submit a cancel request (`PUT /v1/cancel/{jobId}`). Present only when the job is still cancellable (`status` is `not_started` or `running`).
    PagingInfo:
      type: object
      description: Cursor-based pagination metadata returned by the List Render Jobs endpoint.
      required:
      - totalRecords
      properties:
        nextUrl:
          type: string
          format: uri
          description: Absolute URL to the next page of results. Absent on the last page — treat its absence as the end of the result set.
        totalRecords:
          type: integer
          description: Total number of render jobs matching the filter across all pages.
    JobStatus:
      type: object
      required:
      - jobId
      - status
      properties:
        jobId:
          type: string
          description: ID of the render job.
        status:
          type: string
          enum:
          - not_started
          - running
          - canceling
          - canceled
          - succeeded
          - failed
          - partially_succeeded
