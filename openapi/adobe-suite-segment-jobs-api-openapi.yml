            segmentedProfileByNamespaceCounter:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: number
              description: The number of segmented profiles by namespace per segment definition ID.
            segmentedProfileByStatusCounter:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
