  /iteration/report:
    get:
      summary: Report of iteration
      operationId: reportIterations
      parameters:
      - name: filters
        in: query
        description: JSON representing the filtering conditions
        required: false
        content:
          application/json:
            schema:
              type: object
      - name: listOptions
        in: query
        description: JSON object defining the list options
        required: false
        content:
          application/json:
            schema:
              $ref: ./ListOptions.json
      responses:
        '200':
          description: Great Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '422':
          $ref: '#/components/responses/422_UNPROCESSABLE_ENTITY'
        '400':
          $ref: '#/components/responses/400_BAD_REQUEST'
        '429':
          $ref: '#/components/responses/429_TOO_MANY_REQUESTS'
        '403':
          $ref: '#/components/responses/403_FORBIDDEN'
        '401':
          $ref: '#/components/responses/401_UNAUTHORIZED'
        '404':
          $ref: '#/components/responses/404_NOT_FOUND'
        '500':
          $ref: '#/components/responses/500_INTERNAL_SERVER_ERROR'
        '410':
          $ref: '#/components/responses/410_GONE'
      tags:
      - Iteration
  /iteration/moveIssues:
    summary: moveIssues
    put:
      operationId: iterationMoveIssues
      parameters:
      - name: iterationID
        in: query
        description: iterationID
        required: false
        schema:
          type: string
      - name: teamID
        in: query
        description: teamID
        required: false
        schema:
          type: string
      - name: issueIDs
        in: query
        description: issueIDs
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
