  schemas:
    PresetItem:
      type: object
      properties:
        presetId:
          type: string
          description: Unique identifier for the preset.
        label:
          type: string
          description: Human-readable label for the preset.
        mediaType:
          type: string
          description: MIME type of the output media (e.g., video/mp4).
        codec:
          type: string
          description: Video codec used (e.g., H.264).
        profile:
          type: string
          description: Codec profile (e.g., high).
        maxFps:
          type: object
          required:
          - numerator
          - denominator
          properties:
            numerator:
              type: integer
              description: Frames-per-second numerator.
            denominator:
              type: integer
              description: Frames-per-second denominator.
          description: Maximum frames per second as a fraction.
        bitrateMode:
          type: string
          description: Bitrate mode (e.g., vbr, cbr).
        targetBitrateInKbps:
          type: integer
          description: Target bitrate in kilobits per second.
        maxBitrateInKbps:
          type: integer
          description: Maximum bitrate in kilobits per second.
        alpha:
          type: boolean
          description: Whether the preset supports alpha channel.
        primaryUsage:
          type: string
          description: Primary use case for this preset.
      required:
      - presetId
      - label
      - mediaType
      - codec
      - maxFps
      - bitrateMode
      - alpha
      - primaryUsage
    CancelAcceptedResponse:
      type: object
      description: Success response body returned with HTTP 202 when a render job cancel request is accepted. Applies only to render jobs submitted via `POST /v1/templates/render`.
      required:
      - jobId
      - status
      properties:
        jobId:
          type: string
          format: uuid
          description: UUID of the render job for which cancellation was accepted.
        status:
          type: string
          enum:
          - canceling
          description: Transient in-progress status. Poll `GET /v1/status/{jobId}` to observe the terminal `canceled` state.
    TemplateDescribeRequest:
      type: object
      required:
      - source
      properties:
        type:
          type: string
          enum:
          - mogrt
          - aep
          default: mogrt
          description: Input template type. Use `mogrt` for a Motion Graphics Template or `aep` for an After Effects project. Defaults to `mogrt` when omitted.
        source:
          type: object
          required:
          - url
          properties:
            url:
              type: string
              format: uri
              description: A pre-signed URL pointing to the input template file. For `mogrt`, this is a `.mogrt` file. For `aep`, this is a `.zip` archive containing exactly one `.aep` project file together with its collected footage and assets.
          description: Contains metadata about the source of the input template.
        compName:
          type: string
          description: Name of the After Effects composition to describe. Required when `type` is `aep`; not applicable to `mogrt`. This composition name within the AEP project must be unique so that `compName` resolves to a single composition.
      if:
        properties:
          type:
            const: aep
        required:
        - type
      then:
        required:
        - source
        - compName
    TemplateRenderRequest:
      type: object
      required:
      - source
      - variations
      properties:
        type:
          type: string
          enum:
          - mogrt
          - aep
          default: mogrt
          description: Input template type. Use `mogrt` for a Motion Graphics Template or `aep` for an After Effects project. Defaults to `mogrt` when omitted.
        source:
          type: object
          required:
          - url
          properties:
            url:
              type: string
              format: uri
              description: A pre-signed URL pointing to the input template file. For `mogrt`, this is a `.mogrt` file. For `aep`, this is a `.zip` archive containing exactly one `.aep` project file together with its collected footage and assets.
          description: Contains metadata about the source of the input template.
        compName:
          type: string
          description: Name of the After Effects composition to render. Required when `type` is `aep`; not applicable to `mogrt`. This composition name within the AEP project must be unique so that `compName` resolves to a single composition.
        fonts:
          type: array
          description: Array of fonts to be used in the template.
          items:
            type: object
            required:
            - name
            - source
            properties:
              name:
                type: string
                description: PostScript name of the font.
              source:
                type: object
                required:
                - url
                properties:
                  url:
                    type: string
                    format: uri
                    description: Pre-signed URL for the font file (.ttf/.otf).
        config:
          type: object
          description: Configuration options for the render request.
          properties:
            handleMissingFonts:
              type: string
              enum:
              - fail
              - use_default
              default: use_default
              description: How to handle missing fonts. 'fail' will cause the render to fail; 'use_default' will use Premiere Pro fallback behavior.
            sidecar:
              type: string
              enum:
              - aep
              description: Optional. Applicable only when `type` is `aep`. Set to `aep` to also produce the collected After Effects project (a self-contained archive of the `.aep` file and its footage), returned as `sidecarDestination` on each output. Not supported for `mogrt` renders.
        assets:
          type: array
          description: Array of image, video, or audio assets referenced by variations via assetIndex.
          items:
            type: object
            required:
            - source
            properties:
              source:
                type: object
                required:
                - url
                properties:
                  url:
                    type: string
                    format: uri
                    description: Pre-signed URL for the image, video, or audio asset.
        presets:
          type: array
          description: Array of export presets. Each item is either a built-in preset (by presetId) or a custom preset (by URL). Outputs reference presets by presetIndex.
          items:
            type: object
            required:
            - source
            properties:
              source:
                type: object
                properties:
                  presetId:
                    type: string
                    description: ID of a built-in preset from the presets endpoint.
                  url:
                    type: string
                    format: uri
                    description: Pre-signed URL for a custom Encoder preset file.
        variations:
          type: array
          description: List of variations. Each variation contains variable overrides applied to the template.
          minItems: 1
          items:
            type: object
            required:
            - variables
            properties:
              variables:
                type: array
                description: Variable overrides for this variation. Each object targets one template variable by variableId and supplies the override value.
                items:
                  type: object
                  required:
                  - variableId
                  properties:
                    variableId:
                      type: string
                      description: Unique identifier for the template variable, taken verbatim from the describe response. For AEP, this is the composite ID of a control (for example `c259:l261:media` for a media control or `c169:l193:layer:sourceText` for a text control).
                    selectedCheckboxValue:
                      type: boolean
                      description: Override for checkbox controls.
                    selectedDropdownValue:
                      type: string
                      description: Override for dropdown controls.
                    selectedSliderValue:
                      type: number
                      description: Override for slider controls.
                    text:
                      type: string
                      description: Override for text controls.
                    fontName:
                      type: string
                      description: PostScript font name for text controls.
                    assetIndex:
                      type: integer
                      description: Index into the assets array for media or audio controls.
                    scale:
                      type: string
                      enum:
                      - no_scale
                      - fit_to_frame
                      - stretch_to_fill
                      - fill_frame
                      description: Scaling behavior for media controls.
                    audioPreference:
                      type: string
                      enum:
                      - replace
                      - mix
                      description: Audio preference for audio controls.
        layerOperations:
          type: array
          description: Layer-level timing operations applied after variable overrides, in array order. Applicable only when `type` is `aep`; ignored for `mogrt`. Each operation targets a layer by its `layerId` (the `layers[].id` value from the describe response, of the form `c{comp}:l{layer}:layer`). The exact field set depends on `operation`; see the Render guide for the per-operation field reference.
          items:
            type: object
            required:
            - operation
            properties:
              operation:
                type: string
                enum:
                - trim_comp
                - trim_inpoint
                - trim_outpoint
                - shift_inpoint
                - shift_outpoint
                - match_source_duration
                - set_layer_duration
                - stretch_layer
                - enable_layer
                description: The layer operation to perform.
              layerId:
                type: string
                description: Target layer ID (`c{comp}:l{layer}:layer`). Used by all operations except `trim_comp`.
              refLayerId:
                type: string
                description: Reference layer for `shift_inpoint`, `shift_outpoint`, `trim_inpoint`, and `trim_outpoint` (its in/out time, selected by `refInOut`, anchors the move) and for `stretch_layer` (its duration becomes the target duration when no `duration*` field is provided).
              refInOut:
                type: string
                enum:
                - in
                - out
                description: Which end of `refLayerId` to read as the reference time.
              startLayerId:
                type: string
                description: For `trim_comp`, the layer whose in point sets the start of the comp.
              endLayerId:
                type: string
                description: For `trim_comp`, the layer whose out point sets the end of the comp.
              startSeconds:
                type: number
                description: For `trim_comp`, the absolute start time of the comp, in seconds.
              startFrames:
                type: integer
                description: For `trim_comp`, the absolute start time of the comp, in frames.
              offsetSeconds:
                type: number
                description: Offset added to the resolved reference time (`shift_*`, `trim_*`) or target duration (`stretch_layer`), in seconds. Takes precedence over `offsetFrames`.
              offsetFrames:
                type: integer
                description: Offset added to the resolved reference time (`shift_*`, `trim_*`) or target duration (`stretch_layer`), in frames. Used only when `offsetSeconds` is absent.
              durationSeconds:
                type: number
                description: Duration in seconds for `set_layer_duration` and `stretch_layer`, or the comp duration for `trim_comp`. Takes precedence over `durationFrames`.
              durationFrames:
                type: integer
                description: Duration in frames for `set_layer_duration` and `stretch_layer`, or the comp duration for `trim_comp`. Used only when `durationSeconds` is absent.
              durationPercent:
                type: number
                description: 'For `stretch_layer`, the target duration as a percentage of the layer''s native duration. Highest priority of the `stretch_layer` duration inputs: `durationPercent` > `durationSeconds` > `durationFrames` > `refLayerId`.'
              videoEnabled:
                type: boolean
                description: For `enable_layer`, turns the target layer's video (visuals) on or off. Optional; each `enable_layer` operation must set at least one of `videoEnabled`, `audioEnabled`, or `solo`.
              audioEnabled:
                type: boolean
                description: For `enable_layer`, turns the target layer's audio on or off. Optional; each `enable_layer` operation must set at least one of `videoEnabled`, `audioEnabled`, or `solo`.
              solo:
                type: boolean
                description: For `enable_layer`, solos the target layer within its comp; only solo-enabled layers will render. A comp with solo-enabled layers will render against transparency or the comp's background color setting, depending on the render output format. To render audio-only to a video output format, solo an invisible video layer (such as a null) in addition to any solo-enabled audio layers; this is not necessary when rendering to an audio output format. Optional; each `enable_layer` operation must set at least one of `videoEnabled`, `audioEnabled`, or `solo`. If `videoEnabled` and `audioEnabled` are both false for a layer, solo cannot be applied to it.
        outputs:
          type: array
          description: Defines which variation and preset combinations to render and optional output file names.
          items:
            type: object
            required:
            - variationIndex
            - presetIndex
            properties:
              variationIndex:
                type: integer
                description: Zero-based index of the variation to render.
              presetIndex:
                type: integer
                description: Zero-based index of the preset in the presets array.
              fileName:
                type: string
                description: Optional custom file name for the output.
              destination:
                type: string
                description: A pre-signed URL destination for the video output.
      if:
        properties:
          type:
            const: aep
        required:
        - type
      then:
        required:
        - source
        - variations
        - compName
    RenderJobListResponse:
      type: object
      description: Response body for `GET /v1/templates/render-jobs`. Contains render jobs submitted via `POST /v1/templates/render` only.
      required:
      - paging
      - jobs
      properties:
        paging:
          $ref: '#/components/schemas/PagingInfo'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/RenderJobListItem'
          description: Ordered list of render job summaries for the current page. Empty array when no jobs match the filter.
    TemplateDescribeResponse:
      type: object
      required:
      - jobId
      - statusUrl
      properties:
        jobId:
          type: string
          description: Unique identifier for the describe job.
        statusUrl:
          type: string
          format: uri
          description: URL to poll for the status of the describe job.
    ErrorResponse:
      type: object
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
          description: The error code returned with the response.
        message:
          type: string
          description: The error message returned with the response.
        messageId:
          type: string
          description: The error message ID returned with the response.
    TemplateRenderResponse:
      type: object
      required:
      - jobId
      - statusUrl
      properties:
        jobId:
          type: string
          description: Unique identifier for the render job.
        statusUrl:
          type: string
          format: uri
          description: URL to poll for the status of the rendering job.
        cancelUrl:
          type: string
          format: uri
          description: URL to cancel the rendering job.
    PresetsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PresetItem'
      required:
      - items
    RenderJobListItem:
      type: object
      description: Summary of a single template render job as returned by `GET /v1/templates/render-jobs`. Applies only to render jobs submitted via `POST /v1/templates/render`.
      required:
      - jobId
      - status
      - totalJobItems
      - createdDate
      - statusUrl
      properties:
        jobId:
          type: string
          format: uuid
          description: Unique identifier of the render job.
        status:
          type: string
          enum:
          - not_started
          - running
          - succeeded
          - partially_succeeded
          - failed
          - canceled
          description: Current overall status of the render job.
        totalJobItems:
          type: integer
          description: Total number of output items (variation × preset combinations) in this batch render job.
        percentCompleted:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentage of the job completed (0–100). Present only when `status` is `running`.
        createdDate:
          type: string
          format: date-time
          description: ISO 8601 date-time when the render job was submitted.
        completedDate:
          type: string
          format: date-time
          description: ISO 8601 date-time when the job reached a terminal state. Present only when `status` is `succeeded`, `partially_succeeded`, `failed`, or `canceled`.
        statusUrl:
          type: string
          format: uri
          description: Absolute URL to poll for the latest job status (`GET /v1/status/{jobId}`).
        cancelUrl:
          type: string
          format: uri
          description: Absolute URL to submit a cancel request (`PUT /v1/cancel/{jobId}`). Present only when the job is still cancellable (`status` is `not_started` or `running`).
    PagingInfo:
      type: object
      description: Cursor-based pagination metadata returned by the List Render Jobs endpoint.
      required:
      - totalRecords
      properties:
        nextUrl:
          type: string
          format: uri
          description: Absolute URL to the next page of results. Absent on the last page — treat its absence as the end of the result set.
        totalRecords:
          type: integer
          description: Total number of render jobs matching the filter across all pages.
  parameters:
    XRequestIdHeader:
      name: x-request-id
      in: header
      required: false
      description: GUID, unique per request. Auto-generated if not provided.
      schema:
        type: string
        format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      description: The Adobe-generated access token, S2S format.
    X-Api-Key:
      type: apiKey
      name: x-api-key
      in: header
      description: The client ID for authentication.
