specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Adobe Suite
providerId: adobe-suite
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: >-
  https://developer.adobe.com/document-services/pricing/main ,
  https://developer.adobe.com/document-services/pricing/pay-as-you-go ,
  https://developer.adobe.com/document-services/docs/overview/limits
note: >-
  REPLACES the 2026-05-04 scaffold, which invented free/professional/enterprise tiers
  with placeholder quotas that Adobe does not publish. The finding is that Adobe
  publishes a real, numeric public plan for exactly ONE of its 23 API products —
  Acrobat/PDF Services. Everything else in the Adobe API estate (Firefly Services,
  Experience Platform, Analytics, Journey Optimizer, Target, Commerce, Workfront,
  Marketo, AEM, Cloud Manager) is entitled through an enterprise Creative Cloud or
  Experience Cloud contract with no published API price and no self-serve signup, which
  is recorded honestly below rather than filled in with a guess.
tags:
  - Ai
  - Analytics
  - Automation
  - Commerce
  - Creative
  - Design
  - Documents
  - Experience
  - Marketing
  - Personalization
  - Video
description: >-
  Published plans and pricing for the Adobe API surface. Only Adobe Acrobat Services
  (PDF Services, PDF Extract, PDF Accessibility Auto-Tag, Document Generation, Electronic
  Seal, PDF Embed) has a public self-serve plan; the rest of the estate is contract-priced.
plans:
  - id: adobe-acrobat-services-free-tier
    name: Acrobat Services Free Tier
    type: freemium
    product: Adobe Acrobat Services (PDF Services API family)
    url: https://developer.adobe.com/document-services/pricing/main
    description: >-
      Free credentials created in the Adobe Developer Console. Quoted verbatim from
      Adobe's pricing page: "500 free Document Transactions per month", "Access to all
      15+ PDF Services including PDF Extract, PDF Accessibility Auto-Tag API, and
      Document Generation", "No credit card or commitment required".
    signup: https://developer.adobe.com/document-services/
    entries:
      - label: Document Transactions
        description: >-
          A Document Transaction is based on the initial endpoint request (i.e. API call)
          and the digital output.
        name: document_transactions
        type: quota
        metric: document_transactions
        limit: 500
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        currency: USD
        userMultiplied: false
      - label: Rate Limit
        description: Free Tier request ceiling published on the licensing and usage limits page.
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 25
        timeFrame: minute
        geo: global
        unit: 1
        price: '0.00'
        currency: USD
        userMultiplied: false
    elements:
      - name: All 15+ PDF Services
      - name: PDF Extract API
      - name: PDF Accessibility Auto-Tag API
      - name: Document Generation API
      - name: PDF Electronic Seal API
      - name: PDF Embed API
      - name: 100MB maximum file size
      - name: Community forum support
  - id: adobe-acrobat-services-paid
    name: Acrobat Services Paid Plan
    type: paid
    product: Adobe Acrobat Services (PDF Services API family)
    url: https://developer.adobe.com/document-services/pricing/main
    description: >-
      Adobe states: "Paid credentials enable a greater processing quota and require
      entering into a separate written agreement." Volume and multi-product discounts are
      advertised. Adobe does NOT publish a per-transaction price on its public pricing
      pages — the figure is quoted on request. Recorded as `price: contact-sales` rather
      than guessed.
    entries:
      - label: Document Transactions
        name: document_transactions
        type: metered
        metric: document_transactions
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact-sales
        currency: USD
        userMultiplied: false
      - label: Rate Limit
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 100
        timeFrame: minute
        geo: global
        unit: 1
        price: contact-sales
        currency: USD
        userMultiplied: false
        note: 100 RPM is the Enterprise figure published on the licensing and usage limits page.
    elements:
      - name: Higher processing quota
      - name: Volume discounts
      - name: Multi-product discounts
      - name: Separate written agreement required
  - id: adobe-enterprise-contract
    name: Enterprise / Experience Cloud contract
    type: enterprise
    product: >-
      Firefly Services, Adobe Experience Platform, Adobe Analytics, Journey Optimizer,
      Target, Campaign, Marketo Engage, Commerce, Workfront, Experience Manager, Cloud
      Manager, Stock, Creative Cloud Libraries, User Management
    url: https://www.adobe.com/creativecloud/business/enterprise.html
    description: >-
      No public price and no self-serve API plan. API access is entitled through an
      existing Creative Cloud for enterprise or Experience Cloud agreement, provisioned
      per IMS Org in the Adobe Developer Console. Firefly Services additionally meters a
      generative credit consumption model whose rates are set contractually; a free trial
      exists and its exhaustion is signalled at runtime with HTTP 402 "Trial Limit
      Exceeded" on 24 operations in openapi/.
    entries: []
    elements:
      - name: Contract-negotiated volume
      - name: Adobe Developer Console project provisioning
      - name: Named technical account management
      - name: Contractual SLA
gaps:
  - >-
    Adobe publishes no price-per-Document-Transaction for the Acrobat Services paid plan
    on any public page; the pay-as-you-go page renders the Free Tier card only.
  - >-
    Firefly generative credit rates are not published as an API price list.
  - >-
    No machine-readable pricing or catalog endpoint exists for any Adobe API.
plan_count: 3
public_self_serve_products: 1
total_api_products_in_profile: 23
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
