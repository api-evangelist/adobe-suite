note: >-
  Adobe does NOT publish test credentials, magic test values, test cards or fixture
  tooling. What it publishes instead is tenant-level environment isolation — real
  sandboxes with real credentials, provisioned per organization. Nothing below is
  invented; where a value would normally appear (a test key prefix, a magic identifier)
  this file says plainly that Adobe publishes none.
test_vs_live:
  model: separate-environment, not separate-key-prefix
  key_prefixes: none
  note: >-
    Adobe credentials carry no test/live prefix. A Client ID from the Developer Console is
    scoped to a project + workspace, and the workspace (and for Experience Cloud, the
    sandbox) determines which data it touches. There is no way to tell from a credential
    string whether it is a production credential.
environments:
- name: Adobe Developer Console — Development workspace
  scope: all Adobe APIs
  url: https://developer.adobe.com/console/
  description: >-
    Every Developer Console project has at least a Production workspace and can add
    Development workspaces. Each workspace issues its own credentials and its own
    entitlements. This is the primary test/live separation for the whole estate.
  self_serve: true
- name: Adobe Experience Platform Sandboxes
  scope: Experience Platform, Journey Optimizer, Real-Time CDP, Customer Journey Analytics
  docs: https://experienceleague.adobe.com/en/docs/experience-platform/sandbox/home
  spec: openapi/adobe-suite-aep-sandbox-openapi.yaml
  operations: 29
  api_managed: true
  description: >-
    First-class, API-managed tenant isolation. Sandboxes are created, reset and deleted
    programmatically through the Sandbox API (29 operations). Types are `development` and
    `production`; a reset wipes all data in the sandbox while keeping its configuration.
  selector_header: x-sandbox-name
  note: >-
    This is the strongest sandbox story in the Adobe estate and the only one with its own
    machine-readable contract.
