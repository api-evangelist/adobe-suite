name: Adobe I/O CLI
binary: aio
package:
  registry: npm
  name: "@adobe/aio-cli"
  version: 11.1.2
  published: '2026-06-03'
  url: https://www.npmjs.com/package/@adobe/aio-cli
  cross_link: packages/adobe-suite-packages.yml
install:
- method: npm
  command: npm install -g @adobe/aio-cli
- method: npx
  command: npx @adobe/aio-cli
requirements:
  node: '>=18'
architecture: >-
  Plugin-based (oclif). The core `aio` binary ships a small command set and discovers the
  rest through first-party plugins installed with `aio plugins:install`.
command_groups:
- group: aio app
  description: Create, build, run, test and deploy Adobe App Builder applications.
  commands: [app:init, app:build, app:run, app:deploy, app:undeploy, app:test, app:logs, app:use, app:add, app:delete]
- group: aio auth / console
  description: Authenticate against Adobe IMS and select the Developer Console organization, project and workspace the CLI acts on.
  commands: [auth:login, auth:logout, console:org:select, console:project:select, console:workspace:select, console:workspace:download]
- group: aio runtime
  description: Manage Adobe I/O Runtime (serverless) actions, triggers, rules, packages and activations.
  commands: [runtime:action, runtime:activation, runtime:namespace, runtime:package, runtime:rule, runtime:trigger, runtime:deploy, runtime:property]
- group: aio event
  description: Manage Adobe I/O Events providers, event metadata, registrations and journaling.
  commands: [event:provider, event:eventmetadata, event:registration]
  cross_link: asyncapi/adobe-suite-webhooks.yml
- group: aio config
  description: Read and write local CLI configuration and credentials.
  commands: [config:get, config:set, config:delete, config:list]
- group: aio plugins
  description: Install, update and remove CLI plugins.
  commands: [plugins:install, plugins:link, plugins:uninstall, plugins:update]
- group: aio telemetry
  description: Opt in or out of CLI usage telemetry.
  commands: [telemetry]
key_flows:
- flow: Bootstrap an App Builder project
  steps: [aio login, aio console:org:select, aio console:project:select, aio app:init, aio app:deploy]
- flow: Register an Adobe I/O Events webhook
  steps: [aio event:provider:create, aio event:eventmetadata:create, aio event:registration:create]
- flow: Tail serverless logs
  steps: [aio app:logs --tail]
