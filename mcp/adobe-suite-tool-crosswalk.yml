source: >-
  mcp/adobe-suite-mcp.yml (published MCP surface) bound against the 70 first-party
  OpenAPI/Swagger documents in openapi/ (2,857 operations), plus the Adobe Commerce
  GraphQL surface recorded in graphql/adobe-suite-graphql.md
note: >-
  Both Adobe remote MCP endpoints are auth-gated (401 on tools/list), so no live tool
  manifest with inputSchemas could be read. Tools below are mapped by NAME AND SEMANTICS
  from Adobe's published tool-family descriptions, and confidence is set accordingly —
  never `high` for a tool whose schema was never observed. The headline finding is the
  size of `rest_only`: Adobe publishes 2,857 REST operations and exposes an MCP surface
  over roughly two products.
surfaces:
