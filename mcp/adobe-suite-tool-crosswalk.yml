mcp_only:
- tool: marketo.forms.*
  reason: >-
    Adobe documents form browse/create/clone/approve tools, but publishes no OpenAPI for
    the Marketo Asset API in AdobeDocs — the REST reference lives as prose on Experience
    League only. No operationId exists to bind to.
- tool: marketo.smart_campaigns.*
  reason: Smart Campaign create/configure/activate has no published machine-readable contract.
- tool: marketo.leads.*
  reason: Lead and list management has no published OpenAPI; only the Marketo REST prose docs.
- tool: marketo.programs.*
  reason: Program create/clone/tag/browse has no published OpenAPI.
- tool: marketo.emails.*
  reason: Email and snippet management has no published OpenAPI.
- tool: marketo.bulk_export.*
  reason: Bulk Lead Export has no published OpenAPI.
- tool: aem.*
  reason: >-
    The AEM as a Cloud Service MCP server has no counterpart OpenAPI in this repo. Adobe
    publishes AEM developer reference material but no AEM content/assets OpenAPI in the
    AdobeDocs org, so every AEM tool is MCP-only against the catalog.
- tool: express-developer-mcp.*
  reason: >-
    Documentation-retrieval tools (semantic doc search, TypeScript definitions). These
    are not projections of an API; there is nothing to bind.
