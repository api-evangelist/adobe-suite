    location: openapi/
    documents: 70
    operations: 2857
    gated: false
  graphql:
    endpoint: https://commerce.adobe.io (Adobe Commerce GraphQL)
    docs: https://developer.adobe.com/commerce/webapi/graphql-api/
    introspection: not-attempted-anonymously
    gated: true
    note: Commerce GraphQL is per-tenant; there is no public shared endpoint to introspect.
  mcp:
