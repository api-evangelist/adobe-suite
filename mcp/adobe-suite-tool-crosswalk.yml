    url: https://marketo-mcp.adobe.io/mcp
    gated: true
    probe_status: 401
  - name: aem-cloud-service-mcp
    url: https://mcp.adobeaemcloud.com/adobe/mcp/aem
    gated: true
    probe_status: 401
  - name: adobe-express-developer-mcp
    transport: stdio
    gated: false
    note: Documentation-retrieval server; has no backing REST data plane, so it is excluded from binding.
