aid: adobe-suite
url: https://raw.githubusercontent.com/api-evangelist/adobe-suite/refs/heads/main/apis.yml
name: Adobe Suite
description: 'Adobe operates one of the largest first-party API estates in software: 70 published
  OpenAPI and Swagger contracts covering 2,857 operations across Creative Cloud, Document Cloud and
  Experience Cloud. The surface spans generative AI (Firefly image, video, audio and Substance 3D),
  creative automation (Photoshop, Lightroom, Illustrator, InDesign, Express), document services (PDF
  Services, Extract, Accessibility Auto-Tag, Acrobat Sign), marketing and data (Analytics, Experience
  Platform, Journey Optimizer, Target, Campaign, Marketo Engage), commerce, work management (Workfront),
  and platform operations (Cloud Manager, User Management, Adobe I/O Events, Status). Every API authenticates
  through Adobe Identity Management Services (IMS) with an OAuth 2.0 access token plus an x-api-key
  client ID, provisioned per project and workspace in the Adobe Developer Console.'
